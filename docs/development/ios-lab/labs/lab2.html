<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da ilha</title>
<style>
  /* 7 Nov: what Safari shows around the Dynamic Island and in the bottom strip — the page (a scene lifted 70 px, as the Method's
     --m-lift) or the colour of html/body? html/body are MAGENTA on purpose: if magenta shows, Safari paints the colour, not the scene. */
  html, body { margin: 0; background: #e0f; color: #fff; font: 600 20px/1.3 -apple-system, system-ui, sans-serif; }
  .s { height: 110lvh; background: #333; display: grid; place-items: center; text-align: center; padding: 0 20px; }
  .t { height: 400lvh; position: relative; }
  .k { position: sticky; top: -70px; margin-top: -70px; height: calc(100lvh + 70px + 130px); overflow: hidden;
       background: linear-gradient(90deg, #fff 0 50%, #111 50% 100%); }
  .k i { position: absolute; top: 0; bottom: 0; width: 30%; left: -30%; background: #f80; animation: sweep 4s linear infinite; }
  @keyframes sweep { to { left: 100%; } }
  .k span { position: absolute; top: 45%; left: 0; right: 0; text-align: center; mix-blend-mode: difference; }
  .n { height: 110lvh; background: #333; display: grid; place-items: center; }
  button { font: inherit; padding: 10px 14px; margin: 6px; border-radius: 10px; border: 0; }
</style>
</head>
<body>
<section class="s"><div>1 · desça devagar até à cena (branco | preto, com uma faixa laranja a passar)<br><br>
  <button onclick="c('#e0f')">fundo magenta</button><button onclick="c('#111')">fundo escuro</button><button onclick="c('#fff')">fundo branco</button><br><br><a href="#f" style="color:#fff">📎 enviar gravação (no fim da página)</a></div></section>
<div class="t"><div class="k"><i></i><span>2 · cena presa, 70 px acima do ecrã<br>a ilha mostra branco|preto e o laranja?<br>ou magenta?</span></div></div>
<section class="n"><div style="text-align:center;padding:0 20px">3 · fim<br><br>
  <label style="display:inline-block;background:#fff;color:#000;padding:14px 18px;border-radius:12px">📎 Enviar gravação
  <input id="f" type="file" accept="video/*,image/*" multiple style="display:none"></label>
  <div id="st" style="margin-top:14px;font-size:16px"></div></div></section>
<script>
// sends each chosen file to the PC (proxy /__diag/file, saved in out/), one at a time, with progress
document.getElementById('f').addEventListener('change', function (e) {
  var files = [].slice.call(e.target.files), st = document.getElementById('st'), i = 0
  var next = function () {
    if (i >= files.length) { st.textContent = 'Enviado ✓ (' + files.length + ')'; return }
    var f = files[i++], x = new XMLHttpRequest()
    x.open('POST', '/__diag/file?name=' + encodeURIComponent('lab2-' + f.name))
    x.upload.onprogress = function (p) { if (p.lengthComputable) st.textContent = f.name + ' — ' + Math.round(100 * p.loaded / p.total) + ' %' }
    x.onload = function () { x.status === 200 ? next() : (st.textContent = 'FALHOU: ' + x.status) }
    x.onerror = function () { st.textContent = 'FALHOU (rede)' }
    x.send(f)
  }
  next()
})
</script>
<script>function c(v){document.documentElement.style.background=v;document.body.style.background=v}</script>
</body>
</html>
