<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da ilha 2</title>
<style>
  /* 7 Nov, second test: which kind of element reaches behind the Dynamic Island? lab2 showed a sticky stage (top -70px) does NOT
     (Safari paints html's colour there), while plain flow content does (blurred, tinted). html/body MAGENTA on purpose.
     A: flow — an absolutely placed scene inside a tall section that scrolls normally
     B: fixed, top 0 — a full-screen layer, shown while section B is on screen
     C: fixed, top -70px
     D: sticky, top -70px (lab2, again, for comparison) */
  html, body { margin: 0; background: #e0f; color: #fff; font: 600 20px/1.3 -apple-system, system-ui, sans-serif; }
  .gap { height: 80lvh; background: #333; display: grid; place-items: center; text-align: center; padding: 0 20px; }
  .scene { background: linear-gradient(90deg, #fff 0 50%, #111 50% 100%); overflow: hidden; }
  .scene i { position: absolute; top: 0; bottom: 0; width: 30%; left: -30%; background: #f80; animation: sweep 4s linear infinite; }
  @keyframes sweep { to { left: 100%; } }
  .scene b { position: absolute; top: 45%; left: 0; right: 0; text-align: center; mix-blend-mode: difference; font-size: 34px; }
  .a { position: relative; height: 250lvh; }
  .t { height: 250lvh; position: relative; }
  .fx { position: fixed; left: 0; right: 0; height: calc(100lvh + 200px); z-index: 1; display: none; }
  .fx.on { display: block; }
  #fb { top: 0; } #fc { top: -70px; }
  .d { position: sticky; top: -70px; margin-top: -70px; height: calc(100lvh + 70px + 130px); }
  .n { height: 110lvh; background: #333; display: grid; place-items: center; text-align: center; }
  button, label { font: inherit; padding: 12px 16px; margin: 6px; border-radius: 12px; border: 0; background: #fff; color: #000; display: inline-block; }
</style>
</head>
<body>
<section class="gap"><div>Desça devagar. Quatro cenas: A, B, C, D.<br>Em cada uma: a ilha mostra o branco|preto com o laranja a passar, ou magenta?</div></section>
<section class="a scene"><i></i><b>A · fluxo normal</b></section>
<section class="gap">a seguir: B</section>
<section class="t" data-fx="fb"></section>
<section class="gap">a seguir: C</section>
<section class="t" data-fx="fc"></section>
<section class="gap">a seguir: D</section>
<div class="t"><div class="d scene"><i></i><b>D · sticky −70 px</b></div></div>
<section class="n"><div>fim<br><br><label>📎 Enviar gravação<input id="f" type="file" accept="video/*,image/*" multiple style="display:none"></label>
  <div id="st" style="margin-top:14px;font-size:16px"></div></div></section>
<div class="fx scene" id="fb"><i></i><b>B · fixed, top 0</b></div>
<div class="fx scene" id="fc"><i></i><b>C · fixed, top −70 px</b></div>
<script>
// each fixed layer is on while its section covers the middle of the screen
var secs = [].slice.call(document.querySelectorAll('[data-fx]'))
var tick = function () {
  secs.forEach(function (s) { var r = s.getBoundingClientRect(), on = r.top < innerHeight * 0.5 && r.bottom > innerHeight * 0.5
    document.getElementById(s.dataset.fx).classList.toggle('on', on) })
}
addEventListener('scroll', tick, { passive: true }); tick()
// sends each chosen file to the PC (proxy /__diag/file, saved in out/), one at a time, with progress
document.getElementById('f').addEventListener('change', function (e) {
  var files = [].slice.call(e.target.files), st = document.getElementById('st'), i = 0
  var next = function () {
    if (i >= files.length) { st.textContent = 'Enviado ✓ (' + files.length + ')'; return }
    var f = files[i++], x = new XMLHttpRequest()
    x.open('POST', '/__diag/file?name=' + encodeURIComponent('lab3-' + f.name))
    x.upload.onprogress = function (p) { if (p.lengthComputable) st.textContent = f.name + ' — ' + Math.round(100 * p.loaded / p.total) + ' %' }
    x.onload = function () { x.status === 200 ? next() : (st.textContent = 'FALHOU: ' + x.status) }
    x.onerror = function () { st.textContent = 'FALHOU (rede)' }
    x.send(f)
  }
  next()
})
</script>
</body>
</html>
