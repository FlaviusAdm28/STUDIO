<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da ilha 3</title>
<style>
  /* 7 Nov, third test. lab3: only content that scrolls with the page reaches behind the Dynamic Island; fixed and sticky are cut and
     Safari paints html's colour (magenta here, on purpose). Can a HELD stage be content in flow, held still by the scroll itself?
     E: a stage in flow, moved down by a CSS scroll-driven animation (view timeline, range contain) exactly as the page scrolls
     F: the same, moved by JavaScript on every scroll event (expected to shake on iOS: the script runs after the scroll is drawn)
     D: sticky, as the site today, for comparison. Watch: does the island show the scene? does the stage stay still or shake? */
  html, body { margin: 0; background: #e0f; color: #fff; font: 600 20px/1.3 -apple-system, system-ui, sans-serif; }
  .gap { height: 80lvh; background: #333; display: grid; place-items: center; text-align: center; padding: 0 20px; }
  .scene { background: linear-gradient(90deg, #fff 0 50%, #111 50% 100%); overflow: hidden; }
  .scene i { position: absolute; top: 0; bottom: 0; width: 30%; left: -30%; background: #f80; animation: sweep 4s linear infinite; }
  @keyframes sweep { to { left: 100%; } }
  .scene b { position: absolute; top: 45%; left: 0; right: 0; text-align: center; mix-blend-mode: difference; font-size: 30px; }
  .scene u { position: absolute; left: 10%; right: 10%; top: 62%; height: 6px; background: #f00; text-decoration: none; }
  .hold { position: relative; height: 350lvh; }
  /* the stage reaches 70 px above the screen and 130 px under it, as the site's held scenes */
  .st { position: absolute; left: 0; right: 0; top: -70px; height: calc(100lvh + 200px); will-change: transform; }
  .e { view-timeline: --e; }
  @supports (animation-timeline: view()) {
    .e .st { animation: hold linear both; animation-timeline: --e; animation-range: contain 0% contain 100%; }
  }
  @keyframes hold { from { transform: translateY(0); } to { transform: translateY(calc(350lvh - 100lvh)); } }
  .d { position: sticky; top: -70px; margin-top: -70px; height: calc(100lvh + 200px); }
  .n { height: 110lvh; background: #333; display: grid; place-items: center; text-align: center; }
  label { font: inherit; padding: 12px 16px; margin: 6px; border-radius: 12px; border: 0; background: #fff; color: #000; display: inline-block; }
</style>
</head>
<body>
<section class="gap"><div>Desça devagar. Três cenas: E, F, D.<br>Em cada uma: a ilha mostra a cena ou magenta? A cena fica parada ou treme (veja a linha vermelha)?<br><br><span id="sup"></span></div></section>
<section class="hold e"><div class="st scene"><i></i><b>E · em fluxo, segura pelo CSS</b><u></u></div></section>
<section class="gap">a seguir: F</section>
<section class="hold f"><div class="st scene" id="fst"><i></i><b>F · em fluxo, segura por JS</b><u></u></div></section>
<section class="gap">a seguir: D</section>
<div class="hold"><div class="d scene"><i></i><b>D · sticky (o site hoje)</b><u></u></div></div>
<section class="n"><div>fim<br><br><label>📎 Enviar gravação<input id="f" type="file" accept="video/*,image/*" multiple style="display:none"></label>
  <div id="st" style="margin-top:14px;font-size:16px"></div></div></section>
<script>
document.getElementById('sup').textContent = CSS.supports('animation-timeline: view()') ? 'animation-timeline: suportado' : 'animation-timeline: NÃO suportado'
// F: the stage moved by the scroll it has passed, kept inside its section
var F = document.querySelector('.f'), fst = document.getElementById('fst')
var hold = function () {
  var r = F.getBoundingClientRect(), max = F.offsetHeight - innerHeight
  fst.style.transform = 'translateY(' + Math.min(max, Math.max(0, -r.top)) + 'px)'
}
addEventListener('scroll', hold, { passive: true }); hold()
document.getElementById('f').addEventListener('change', function (e) {
  var files = [].slice.call(e.target.files), st = document.getElementById('st'), i = 0
  var next = function () {
    if (i >= files.length) { st.textContent = 'Enviado ✓ (' + files.length + ')'; return }
    var f = files[i++], x = new XMLHttpRequest()
    x.open('POST', '/__diag/file?name=' + encodeURIComponent('lab4-' + f.name))
    x.upload.onprogress = function (p) { if (p.lengthComputable) st.textContent = f.name + ' — ' + Math.round(100 * p.loaded / p.total) + ' %' }
    x.onload = function () { x.status === 200 ? next() : (st.textContent = 'FALHOU: ' + x.status) }
    x.onerror = function () { st.textContent = 'FALHOU (rede)' }
    x.send(f)
  }
  next()
})
</script>
</body>
</html>
