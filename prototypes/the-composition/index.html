<style>
/* ============================================================================
   THE SYNTHESIS — 3002 · fourth pass · ONE COMPOSITION

   The three previous passes all shared one unexamined assumption: the
   photograph is a ground, and the type is laid on top of it in VIEWPORT
   coordinates — centred on the frame, centred on the line, centred on the box.
   The camera then moved the photograph underneath that type. Two coordinate
   systems, sliding past each other. That is why the sequence read as elements
   animating independently rather than as a single shot: it WAS two systems.

   THIS PASS HAS ONE COORDINATE SYSTEM, AND IT IS THE PHOTOGRAPH'S.

   Every position in the piece — the statement, the survivor, the name, the deck
   and the whole rail — is authored as a FRACTION OF THE PLATE and resolved to
   screen pixels through the same transform the plate itself is drawn with. The
   type does not sit on the picture; it stands in it. When the camera reframes,
   the type is carried by the reframe, because it is part of what is being
   reframed.

   The measurable consequence, and it is the whole argument: the clearance
   between the type column and the couple is CONSTANT for the entire sequence.
   It cannot drift, because both are expressed in the same space.

   ── READING THE PHOTOGRAPH ──────────────────────────────────────────────────

   `venice.png`, 1536 x 1024. Its own README carries a measured column profile;
   these are that profile plus what the frame shows, as plate fractions:

     the sun, low over the canal        x .102  y .211   brightest block, L 242
     the sun's specular track on water  x .04 – .17      the one place type dies
     the campanile                      x .125           vertical, y .19 – .42
     the Salute, the dome               x .27 – .40      apex y .135
     THE HORIZON, the far shore         y .435 – .45     the frame's one strong
                                                         horizontal
     mooring poles, in the water        x .29 .335 .435  thin verticals
     the moored gondolas                x .00 – .38      dark mass, y .55 – .85
     the quay edge, a diagonal          (.17,1.00) -> (.55,.71)
     THE COUPLE                         x .56 – .81      inside the darkest band
     the darkest eighth of the frame    x .62 – .75      mean L 21
     the lamp post, a vertical          x .615           y .00 – .42
     the palazzo wall                   x .80 – 1.00     dark AND high-detail

   The picture is therefore built as LIGHT LEFT / DARK RIGHT, divided by the
   lamp post above and the quay edge below, with one horizontal running through
   it at y .44. Type belongs in the light left, below the horizon, clear of the
   sun's track and clear of the couple. That is:

           THE CANAL, BETWEEN THE SUN AND THE COUPLE
           x .255 -> .515        y .455 -> .63

   which is where `ANCHOR` puts it. Not "left-aligned on principle" — chosen,
   and the numbers above are why.

   ── WHY THE RAIL LANDS WHERE IT LANDS ───────────────────────────────────────

   The plate is 120% wide and pans left by `--pan-throw` (19vw), so the frame
   travels rightward across the picture — off the canal, which is the direction
   the README derives and locks.

     the window at rest      plate x .000 -> .833
     the window fully panned  plate x .158 -> .992

   A column standing at plate x .255 is therefore at screen .306V when the
   sequence starts and at screen .116V when it ends. At 1440 that is 441px ->
   167px. THE COLUMN ARRIVES AT THE MARGIN, and it arrives there because the
   camera moved, not because anything travelled.

   So the rail's position is not chosen at all. It is where the photograph's own
   typographic column has ended up once the reframe is finished. The hierarchy
   the whole pass is built to test —

        PHOTOGRAPHY -> ANCHOR -> CAMERA -> STUDIO -> RAIL

   — is literally the order in which these numbers are computed below.

   ── WHAT WAS REMOVED, AND WHY ───────────────────────────────────────────────

   Everything here is a subtraction. No mechanism is introduced.

     the line closing up     The previous pass re-centred the line as it was
                             eaten, so the survivors slid. That is a reflow: it
                             reads as text being deleted in an editor. In a
                             column with authored breaks nothing reflows and the
                             words simply recede where they stand.
     the becoming's travel   The survivor was moved to the centre of the frame.
                             It now never moves at all: it is already where it
                             belongs, because the column was placed there.
     the card's `carry`      A drift added so the card would "point at" the
                             rail. The type is carried by the camera at the
                             plate's own rate now, always, so a special drift at
                             the end is a second answer to a solved problem.
     the deck's wipe         An entrance that existed to be an entrance.
     the veil                A blurred panel behind the deck, needed only
                             because the deck was centred on the busiest water
                             in the frame. Placed in the calm column it is not
                             needed, and a panel behind type is not editorial.
     the three-stroke mark   Drawn, then laid down, then stacked: a movement
                             whose only purpose was to be a movement, and whose
                             destination was three horizontal bars in a corner.
                             The chapter's position is a folio now.

   ── THE ONE THING THAT MOVES ────────────────────────────────────────────────

   The camera. One lateral pan, one `easeInOut`, one direction, from the first
   frame to the last. Everything else in the piece is light and ink.
   ========================================================================= */

:root{
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
  --ink: #f2ece0;
  --ink-quiet: rgb(242 236 224 / .62);

  /* The survivor NEVER changes size while it is the subject. */
  --sent: clamp(1.25rem, calc(52 / 1440 * 100vw), 4.25rem);
  --sub-size: clamp(0.8rem, calc(31 / 1440 * 100vw), 2.05rem);

  --nav-size: clamp(0.9rem, calc(15 / 1440 * 100vw), 1rem);
  --rule-unit: 1rem;
  --rule-intent: 4.375rem;

  /* 3000's `--env-pan-throw` is 20vw and the plate overhangs by exactly 20% of
     the stage. 19 keeps a hair of margin — measured on 3000, its own pan stops
     at 18.9vw. */
  --pan-throw: 19vw;

  --curve: cubic-bezier(.22,.61,.36,1);
  --fade-nav-hover: 420ms;
}

@media (max-width: 820px){
  :root{ --sent: clamp(1.05rem, 5vw, 1.6rem) }
}

*{box-sizing:border-box}
html{background:#000}
body{
  margin:0; background:#050505; color:var(--ink);
  font-family:var(--serif); font-weight:300;
  -webkit-font-smoothing:antialiased;
}
.runway{height:900vh}
.stage{position:fixed; inset:0; overflow:hidden; background:#050505}

/* ---------------------------------------------------------------- the plate */
/* 120% wide and NOT scaled: the overhang is the room the camera moves into, so
   the frame travels without the picture growing. A scaled plate would push in
   as it panned, and a push is a different verb from a reframe. */
.plate{
  position:absolute; top:0; bottom:0; left:0; width:120%;
  background-image:url('/media/projects/venice/venice.png');
  background-size:cover; background-position:center 42%;
  will-change:transform,filter;
}
/* MUST come after the base rule: same specificity, source order decides. */
@media (max-width: 820px){
  .plate{ background-position:62% 42% }
}

/* ------------------------------------------------------------- the sentence */
/* A COLUMN, not a line. The block is placed at a plate coordinate by the
   driver; the lines inside it are ordinary flow, with authored breaks, and
   NOTHING in it is ever repositioned. Only ink changes.

   One word per line, so that EVERY state of the gesture is flush — not only
   the first and the last:

        Some
        moments
        deserve
        another
        chapter.

   Left to right in the reading, top to bottom in the frame. The stack empties
   downward and leaves `another` and then `chapter.` standing at x=0 of the
   column, exactly where every word before them stood. See `LINES` for why a
   prose break cannot do this. */
.sentence{
  position:absolute; left:0; top:0;
  /* 1.02, not 1.16. Five one-word lines are a STACK, and a stack is held
     together by its leading: at 1.16 the words read as five separate captions
     that happen to share an edge, at 1.02 they read as one object. It also
     buys back 68px, which is what keeps the rail inside the frame. */
  font-size:var(--sent); line-height:1.02;
  color:rgb(240 230 214 / .82);
  white-space:nowrap;
}
.sentence .ln{ display:block }
.sentence .w{ will-change:opacity }

/* --------------------------------------------------------------- the lockup */
/* A zero-size anchor at the survivor's own top-left. Both words hang from it
   FLUSH LEFT, not centred: left-aligned, the exchange keeps one edge fixed, so
   two words of different widths read as one word settling rather than as two
   words swapping around a shared centre. */
.lockup{ position:absolute; left:0; top:0; width:0; height:0 }
.lockup span{
  position:absolute; left:0; top:0;
  white-space:nowrap;
  font-size:var(--sent); line-height:1.16;
  will-change:opacity;
}
#lkFrom{ font-weight:300; color:rgb(240 230 214 / .82) }
/* The promotion is weight and letterspacing at the same size — a word settling
   into a mark, not a word being emboldened. */
#lkTo{ font-weight:300; letter-spacing:.06em; color:var(--ink) }

/* THE DECK. Solved in the type, not with a panel behind it:
     weight    300 -> 500   stems gain mass to survive a photographic ground
     ink       .82 -> 1     the deck is a statement, not a caption
     tracking      .075em   opens the shapes against high-frequency detail
   Left-aligned on the column, like everything else. */
.subtitle{
  position:absolute; left:0; top:0; margin:0;
  white-space:nowrap;
  font-family:var(--serif); font-weight:500;
  font-size:var(--sub-size); letter-spacing:.075em;
  color:var(--ink);
  will-change:opacity;
}

/* ------------------------------------------------------------------ the rail */
/* No `left` of its own. The driver puts it on the column, because that is the
   only claim this pass is making. */
.rail{
  position:absolute; left:0; top:0;
  font-family:var(--sans);
  font-size:var(--nav-size);
}
/* The chapter's position, as a folio ABOVE the name — same left edge, a value
   quieter. It is a running head, not a title, and it does not sit beside the
   name where it would compete for the same rank. */
.rail-folio{
  font-family:var(--serif); font-weight:300;
  letter-spacing:.22em; font-size:.86em;
  color:rgb(242 236 224 / .55);
  margin-bottom:.35rem;
  will-change:opacity;
}
.rail-head{
  font-weight:500; color:var(--ink); letter-spacing:.06em;
  margin-bottom:1.5rem;
  will-change:opacity;
}
.rail-index ul{ display:flex; flex-direction:column; gap:.5rem; margin:0; padding:0; list-style:none }
.rail-index li{ display:flex; align-items:baseline; gap:.5rem; opacity:var(--i,0) }
.rail-index li:nth-child(1){ --i:var(--i1,0); --l:0 }
.rail-index li:nth-child(2){ --i:var(--i2,0); --l:0 }
.rail-index li:nth-child(3){ --i:var(--i3,0); --l:0 }
.rail-index li:nth-child(4){ --i:var(--i4,0); --l:0 }
.rail-index li:nth-child(5){ --i:var(--i5,0); --l:0 }

.ledger-word{
  appearance:none; border:0; background:none; font:inherit;
  margin-block:-.5rem; padding:.5rem 0;
  font-weight:500; letter-spacing:.06em;
  color:var(--ink-quiet); text-align:left; text-decoration:none; cursor:pointer;
  transition:color var(--fade-nav-hover) var(--curve);
}
.ledger-word:hover{ color:var(--ink) }
.ledger-rule{
  flex:none; height:1px; background:currentcolor; opacity:.55;
  width:calc(var(--rule-unit) * var(--l,0) * var(--i,0));
  transition:width var(--fade-nav-hover) var(--curve);
}
.rail-index li:has(.ledger-word:hover) > .ledger-rule{ width:var(--rule-intent) }

/* A zero-width inline probe. `vertical-align:baseline` makes its box top sit on
   the baseline, so reading its rect gives the true baseline of whatever type it
   is inside — which is how the name, the folio and the deck are aligned to the
   survivor across three different type sizes without a hardcoded offset. */
.bl{ display:inline-block; width:0; height:0; vertical-align:baseline }

/* ------------------------------------------------------------- review tools */
.hud{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  font-family:var(--sans); font-size:11px; letter-spacing:.06em;
  color:#9b958a; background:rgba(0,0,0,.72);
  padding:7px 12px 9px; display:flex; gap:14px; align-items:center;
  backdrop-filter:blur(6px);
}
.hud[hidden]{display:none!important}
.hud .phase{color:#f2ece0; min-width:290px; text-transform:uppercase}
.hud .p{min-width:64px}
.hud input{flex:1; accent-color:#f2ece0}
.hud .hint{opacity:.55}

/* The composition overlay — review only, `G` toggles. Draws the plate rectangle
   the type was authored into and the horizon it stands under, so the claim can
   be checked against the picture rather than argued about. */
.guides{ position:absolute; inset:0; pointer-events:none; opacity:0 }
.guides.on{ opacity:1 }
.guides i{ position:absolute; background:none; border:1px solid rgba(255,90,90,.55) }
.guides .h{ border:0; border-top:1px dashed rgba(90,190,255,.55); left:0; right:0; height:0 }
.guides .v{ border:0; border-left:1px dashed rgba(90,190,255,.4); top:0; bottom:0; width:0 }
</style>

<div class="stage">
  <div class="plate" id="plate"></div>

  <div class="sentence" id="sentence"></div>

  <div class="lockup" id="lockup">
    <span id="lkFrom">chapter.<i class="bl"></i></span><span id="lkTo">Studio<i class="bl"></i></span>
  </div>

  <p class="subtitle" id="subtitle">What we actually make<i class="bl"></i></p>

  <nav class="rail" id="rail">
    <div class="rail-folio" id="railFolio">III</div>
    <div class="rail-head" id="railHead"><span id="railLab">Studio<i class="bl"></i></span></div>
    <div class="rail-index">
      <ul>
        <li><i class="ledger-rule"></i><button class="ledger-word">Work</button></li>
        <li><i class="ledger-rule"></i><a class="ledger-word" href="#">About</a></li>
        <li><i class="ledger-rule"></i><a class="ledger-word" href="#">Method</a></li>
        <li><i class="ledger-rule"></i><a class="ledger-word" href="#">Questions</a></li>
        <li><i class="ledger-rule"></i><a class="ledger-word" href="#">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="guides" id="guides">
    <i class="col" id="gCol"></i><i class="h" id="gHor"></i><i class="v" id="gSun"></i><i class="v" id="gCpl"></i>
  </div>
</div>

<div class="runway"></div>

<div class="hud" id="hud">
  <span class="phase" id="hudPhase">—</span>
  <span class="p" id="hudP">0.000</span>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span class="hint">H hud · G guides · ←/→ step</span>
</div>

<script>
/* ===========================================================================
   THE PHOTOGRAPH — the first term of the hierarchy, and the source of every
   coordinate below.
   =========================================================================== */

/* The plate's own aspect. `background-size:cover` is resolved from this rather
   than from the decoded bitmap, so the geometry is available on the first frame
   without waiting for a load event. */
const PLATE_AR = 1536/1024;

/* THE ANCHOR — authored in plate fractions, chosen from the reading at the top
   of this file. Every one of these is a claim about the photograph:

     colX  .255  clear of the sun's specular track (which ends at .17) with room
                 to spare, and immediately right of the campanile — so the one
                 man-made vertical in the light half of the frame stands beside
                 the column rather than inside it.
     colY  .455  just under the horizon (.44). The type stands ON THE WATER with
                 the Salute and the far shore above it. Above the horizon it
                 would be sky-lettering; below it, it is in the plane.
     colW  .260  ~450px at 1440 — the measure that sets `Some moments deserve`
                 as one line and still ends 80px clear of the couple at .56.
     deck  .72   of the survivor's own size, dropped below its baseline.
   */
const ANCHOR = {
  colX : 0.255,
  /* .35, not .455. With five lines the stack is 274px deep at this frame, and
     hung below the horizon it would run out of the bottom of the picture and
     take the rail with it. At .35 the stack STRADDLES the horizon (.44): the
     first two words stand against the far shore and the sky, the last three on
     the open water. The column crossing the frame's one strong horizontal is
     what ties it into the picture rather than laying it over the top. */
  colY : 0.350,
  /* One word wide now — `moments` is the longest at ~161px. The measure is kept
     as an authored number because the guides and the assertions are drawn from
     it, and because it states what the column is allowed to become. */
  colW : 0.130,
  deckDrop : 0.72,
};

/* Where the picture's own features are, for the review overlay only. Nothing
   below reads these; they exist so the composition can be SEEN to be true. */
const FEATURES = { horizon:0.44, sunTrackR:0.17, coupleL:0.56 };

/* THE COLUMN — ONE WORD PER LINE, and that is forced rather than chosen.

   The first attempt broke it as prose, `Some moments deserve / another /
   chapter.`, so that the two survivors would be flush with the column's left
   edge. It protected the end of the gesture and destroyed the middle of it.

   MEASURED, at p = .311: `deserve` stood alone at screen x 760 while `another`
   and `chapter.` stood at 420. The line it belonged to was two thirds
   invisible, so the word was stranded at the end of a rule nobody could see —
   three scattered words rather than a column.

   It is not a bad break; it is the only kind of break that exists. Given the
   three rules this pass is built on —

     the consumption reads left to right
     a word recedes WHERE IT STANDS
     nothing reflows

   — every line carrying more than one word must strand its later words as its
   earlier ones go. One word per line is the only arrangement in which every
   intermediate state is as flush as the first and the last. */
const LINES = [
  ['Some'],
  ['moments'],
  ['deserve'],
  ['another'],
  ['chapter.'],
];
/* Index of every word in reading order, so the recession is one sequence across
   three lines rather than three sequences. */
const LEAVERS = [0,1,2];   // Some, moments, deserve
const ANOTHER = 3;
const KEEPER  = 4;         // chapter.

/* ===========================================================================
   THE MAP. Unchanged in shape from the third pass — this is a composition
   pass, not a timing pass — except where a phase described a movement that no
   longer exists.
   =========================================================================== */
const PH = {
  holdStatement : [0.000, 0.070],
  /* The consumption. Three words across .35 of the gesture, and it is still the
     slowest thing in the piece. */
  leaversFade   : [0.070, 0.420],
  /* .420 – .500 `another chapter.` stands. */
  anotherLeaves : [0.500, 0.570],
  /* The sentence's `chapter.` hands over to the lockup's identical `chapter.` —
     same face, size, weight and PIXEL, so the crossfade only moves ownership. */
  handoff       : [0.550, 0.590],
  /* Only the START is read: the exchange is a fade out, a gap and a fade in,
     measured in pixels forward from here. See `DIP`. */
  becomes       : [0.620, 0.660],
  /* .660 – .700 Studio holds alone. */
  deckArrives   : [0.700, 0.760],
  /* .760 – .800 the card complete. */
  /* THE SETTLE. The display name goes out while the rail's name comes in, on
     the same left edge and the same baseline. Overlapped on purpose: the word
     is never absent, so what is seen is one word changing rank, not one word
     leaving and another arriving. */
  nameOut       : [0.800, 0.880],
  nameIn        : [0.830, 0.900],
  folio         : [0.860, 0.920],
  indexDraws    : [0.880, 0.958],
  /* .958 – 1.000 THE HOLD. */

  /* THE CAMERA, and it is the only thing in the piece that moves. One
     `easeInOut` from the first frame to the last: its slowest part lies under
     the statement, which is a hold; its fastest under the exchange, where the
     momentum belongs; and it decelerates to a true standstill under the
     arrival, so the index is written onto a frame that has stopped. */
  pans          : [0.000, 0.958],
};

/* The exchange in PIXELS OF SCROLL, because a breath is a duration the hand
   feels and must not change length when the runway does. */
const DIP = { out:100, gap:30, in:100 };

const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const t=(p,[a,b])=>clamp((p-a)/(b-a));
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;

/* ── THE EXPOSURE ────────────────────────────────────────────────────────────
   ONE CURVE, MONOTONIC, AND THE PHOTOGRAPH IS NEVER ABSENT.

   The third pass opened at brightness .132, sampled off 3000. At .132 the
   campanile, the water and the couple are all below the point where the eye
   reads them as an image — so the frame said "some moments deserve another
   chapter" while erasing the moment it was talking about. C10 already settled
   this argument for the film's own state 06 and raised it to .62; the floor
   here is the same decision applied from the first frame.

   .42 is the lowest value at which this negative still reads as a photograph
   rather than as a texture: the sun holds, the Salute separates from the sky,
   and the couple are legible as two people. It opens to .86 as the scene comes
   alive and settles there. No dip, no second move — one curve. */
const EXPOSURE=[[0,0.42],[0.30,0.50],[0.62,0.66],[0.80,0.75],[0.95,0.86],[1,0.86]];
function exposureAt(p){
  for(let i=1;i<EXPOSURE.length;i++){
    if(p<=EXPOSURE[i][0]){
      const [a,av]=EXPOSURE[i-1], [b,bv]=EXPOSURE[i];
      return lerp(av,bv,easeInOut(clamp((p-a)/(b-a))));
    }
  }
  return EXPOSURE[EXPOSURE.length-1][1];
}

function dip(){
  const s=PH.becomes[0], k=1/(runway||1);
  const outEnd=s+DIP.out*k, inStart=outEnd+DIP.gap*k;
  return {start:s, outEnd, inStart, inEnd:inStart+DIP.in*k};
}

/* --------------------------------------------------------------------- dom */
const sentenceEl=document.getElementById('sentence');
const lockupEl=document.getElementById('lockup');
const lkFrom=document.getElementById('lkFrom');
const lkTo=document.getElementById('lkTo');
const subEl=document.getElementById('subtitle');
const plateEl=document.getElementById('plate');
const railEl=document.getElementById('rail');
const railLab=document.getElementById('railLab');
const railFolio=document.getElementById('railFolio');
const guidesEl=document.getElementById('guides');
let M=null;

/* ===========================================================================
   PLATE SPACE

   Resolves `background-size:cover` and `background-position` by hand, so a
   plate fraction can be converted to a screen pixel. This is the single
   function that makes the type and the photograph one composition: everything
   downstream is expressed through it.
   =========================================================================== */
function plateGeom(stageW, stageH){
  const W = plateEl.getBoundingClientRect().width;   // 120% of the stage
  let iw, ih;
  if (W/stageH >= PLATE_AR){ iw = W;  ih = W/PLATE_AR; }   // cover by width
  else                     { ih = stageH; iw = stageH*PLATE_AR; }
  /* `background-position` computes to percentages here; the offset is
     (container - image) * pct, which is negative wherever the image overflows,
     and that is exactly the crop. */
  const bp = getComputedStyle(plateEl).backgroundPosition.split(/\s+/);
  const px = parseFloat(bp[0]), py = parseFloat(bp[1]);
  const fx = isNaN(px) ? 0.5 : px/100;
  const fy = isNaN(py) ? 0.42 : py/100;
  return { iw, ih, ox:(W-iw)*fx, oy:(stageH-ih)*fy };
}

/* ===========================================================================
   Measure once. Every position is derived from the plate and from measured
   type metrics, so no frame can reflow or collide.
   =========================================================================== */
function measure(){
  const stageW=window.innerWidth, stageH=window.innerHeight;
  const g = plateGeom(stageW, stageH);

  /* THE COLUMN, in screen pixels. `x` is the un-panned position; the pan is
     added every frame, which is what carries the type with the picture. */
  const colX = g.ox + ANCHOR.colX*g.iw;
  const colY = g.oy + ANCHOR.colY*g.ih;
  const colW = ANCHOR.colW*g.iw;

  /* The block is laid out ONCE, in ordinary flow, at the column's origin. It is
     never re-laid-out and never re-positioned relative to itself: the driver
     moves the whole block and changes ink, nothing else. */
  let n=0;
  sentenceEl.innerHTML = LINES.map(line =>
    `<span class="ln">` + line.map(w=>`<span class="w" data-i="${n++}">${w}</span>`).join(' ') + `</span>`
  ).join('');
  const words=[...sentenceEl.querySelectorAll('.w')];
  sentenceEl.style.transform=`translate(${colX}px, ${colY}px)`;

  const fs=parseFloat(getComputedStyle(sentenceEl).fontSize);

  /* THE SURVIVOR'S OWN GEOMETRY. The lockup, the deck, the name and the whole
     rail are hung from these two numbers, so every one of them shares the
     column's left edge and is aligned to the survivor's baseline. */
  const box=sentenceEl.getBoundingClientRect();
  const kr=words[KEEPER].getBoundingClientRect();
  const keeperDX = kr.left - box.left;          // 0 by construction — asserted below
  const keeperDY = kr.top  - box.top;
  /* The survivor's baseline, read off its own inline probe rather than guessed
     from a line-height. */
  const keeperBase = baselineOf(words[KEEPER]) - box.top;

  /* Baseline offsets of the three other type sizes, measured with the same
     probe so the three sizes can be hung on one baseline without a magic
     number. Each is "how far below this element's top its baseline sits". */
  lockupEl.style.transform='translate(0px,0px)';
  const lkBase   = baselineOf(lkTo);
  const subBase  = baselineOf(subEl)  - subEl.getBoundingClientRect().top;
  railEl.style.transform='translate(0px,0px)';
  const labBase  = baselineOf(railLab) - railEl.getBoundingClientRect().top;

  const subW = subEl.getBoundingClientRect().width;

  /* How far the camera travels, in px. */
  const panPx = stageW*(parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--pan-throw'))/100);

  M={ g, colX, colY, colW, fs, words, box,
      keeperDX, keeperDY, keeperBase, lkBase, subBase, labBase, subW,
      panPx, stageW, stageH };

  /* ── ASSERTIONS. The composition is a claim; these are the claim, checked.
     They log rather than throw, because a prototype that refuses to render
     cannot be looked at — and looking at it is the point. */
  if (Math.abs(keeperDX) > 0.5)
    console.warn('[composition] the survivor is not flush with the column:', keeperDX.toFixed(2)+'px');
  const colRight = ANCHOR.colX + box.width/g.iw;
  if (colRight > FEATURES.coupleL)
    console.warn('[composition] the column reaches the couple: right edge at plate x '+colRight.toFixed(3)+', couple at '+FEATURES.coupleL);
  if (ANCHOR.colX < FEATURES.sunTrackR)
    console.warn('[composition] the column stands in the sun’s specular track');
  console.info('[composition] column plate x '+ANCHOR.colX+' → '+colRight.toFixed(3)+
    ' · screen '+Math.round(colX)+'px at rest, '+Math.round(colX-panPx)+'px reframed'+
    ' · clearance to the couple '+Math.round((FEATURES.coupleL*g.iw+g.ox)-(colX+box.width))+'px, constant');
}

/* The true baseline of an element, in viewport coordinates, read off the
   zero-width `.bl` probe inside it. */
function baselineOf(el){
  const probe=el.querySelector('.bl');
  return probe ? probe.getBoundingClientRect().top : el.getBoundingClientRect().top;
}

/* ===========================================================================
   One frame of the narrative position p.

   Read it in the order the hierarchy names:
     the photograph is exposed and reframed, the column is carried by the
     reframe, the type inside the column recedes, the survivor becomes the
     name, and the rail is written under the name.
   =========================================================================== */
function render(p){
  if(!M) return;

  /* ── 1 · THE CAMERA. One pan, one curve, one direction. ── */
  const pan = easeInOut(t(p, PH.pans));
  const dx  = -M.panPx*pan;
  plateEl.style.transform=`translateX(${dx.toFixed(2)}px)`;
  plateEl.style.filter=`brightness(${exposureAt(p).toFixed(3)})`;

  /* ── 2 · THE COLUMN IS CARRIED BY IT. Not a parallax, not a drift: the same
     number, so the type keeps its place in the picture exactly. This is the
     whole pass in one line. ── */
  const cx = M.colX + dx;
  const cy = M.colY;
  sentenceEl.style.transform=`translate(${cx.toFixed(2)}px, ${cy.toFixed(2)}px)`;

  /* ── 3 · THE CONSUMPTION. Left to right, top to bottom, each word receding
     WHERE IT STANDS. Nothing reflows, nothing recentres, nothing travels: the
     column is a fixed object and the sentence empties out of it. ── */
  const lf=t(p, PH.leaversFade);
  LEAVERS.forEach((i,k)=>{
    M.words[i].style.opacity=String(1-easeInOut(clamp((lf-k*0.297)/0.406)));
  });
  M.words[ANOTHER].style.opacity=String(1-easeInOut(t(p, PH.anotherLeaves)));

  /* ── 4 · THE HAND-OVER. The sentence's `chapter.` and the lockup's are the
     same word at the same pixel, so this only moves ownership. ── */
  const hand=easeInOut(t(p, PH.handoff));
  M.words[KEEPER].style.opacity=String(1-hand);

  /* The lockup hangs from the survivor's own slot in the column, and the
     column's position already carries the camera — so the name inherits the
     reframe without a term of its own. */
  const lkX = cx + M.keeperDX;
  const lkY = cy + M.keeperBase - M.lkBase;
  lockupEl.style.transform=`translate(${lkX.toFixed(2)}px, ${lkY.toFixed(2)}px)`;

  /* ── 5 · THE EXCHANGE. Out, a held frame, in. Two curves with a hole between
     them: `chapter.` is at zero before `Studio` is above it. ── */
  const D=dip();
  const goes =easeInOut(t(p,[D.start,D.outEnd]));
  const comes=easeInOut(t(p,[D.inStart,D.inEnd]));
  const nameOut=easeInOut(t(p, PH.nameOut));
  lkFrom.style.opacity=String(hand*(1-goes));
  lkTo.style.opacity  =String(hand*comes*(1-nameOut));

  /* ── 6 · THE DECK. Same column, same left edge, one value below the name.
     A plain fade: the piece's vocabulary is ink and one camera. ── */
  const deck=easeOut(t(p, PH.deckArrives));
  subEl.style.transform=
    `translate(${lkX.toFixed(2)}px, ${(cy + M.keeperBase + M.fs*ANCHOR.deckDrop - M.subBase).toFixed(2)}px)`;
  subEl.style.opacity=String(deck*(1-nameOut));

  /* ── 7 · THE RAIL. Written on the column, under the name, once the camera has
     brought the column to the margin. Its left edge is the sentence's left
     edge; its first baseline is the survivor's baseline. Nothing about its
     position is chosen here — it is read off the composition above. ── */
  railEl.style.transform=
    `translate(${lkX.toFixed(2)}px, ${(cy + M.keeperBase - M.labBase).toFixed(2)}px)`;
  railLab.parentElement.style.opacity=String(easeInOut(t(p, PH.nameIn)).toFixed(4));
  railFolio.style.opacity=String(easeInOut(t(p, PH.folio)).toFixed(4));

  const ix=t(p, PH.indexDraws);
  for(let i=0;i<5;i++){
    railEl.style.setProperty('--i'+(i+1), easeOut(clamp((ix-i*0.12)/0.42)).toFixed(4));
  }

  /* ── review overlay ── */
  if(guidesEl.classList.contains('on')) drawGuides(dx);

  hud(p);
}

/* Draws the plate rectangle the type was authored into, the horizon it stands
   under, and the two features it was placed between. */
function drawGuides(dx){
  const g=M.g;
  const X=f=>g.ox+f*g.iw+dx, Y=f=>g.oy+f*g.ih;
  const c=document.getElementById('gCol');
  c.style.left=X(ANCHOR.colX)+'px'; c.style.top=Y(ANCHOR.colY)+'px';
  c.style.width=(ANCHOR.colW*g.iw)+'px'; c.style.height=(0.175*g.ih)+'px';
  document.getElementById('gHor').style.top=Y(FEATURES.horizon)+'px';
  document.getElementById('gSun').style.left=X(FEATURES.sunTrackR)+'px';
  document.getElementById('gCpl').style.left=X(FEATURES.coupleL)+'px';
}

/* --------------------------------------------------------------------- hud */
const hudEl=document.getElementById('hud');
const hudPhase=document.getElementById('hudPhase');
const hudP=document.getElementById('hudP');
const scrub=document.getElementById('scrub');
function phaseName(p){
  if(p<0.070) return '1 · the statement stands in the canal';
  if(p<0.420) return '2 · consumed — each word recedes where it stands';
  if(p<0.500) return '3 · another chapter. — read it';
  if(p<0.570) return '4 · another leaves';
  if(p<0.620) return '5 · the hand-over';
  if(p<0.660){
    const D=dip();
    if(p>=D.outEnd&&p<D.inStart) return '6 · THE BREATH — the photograph alone';
    return '6 · THE EXCHANGE — chapter. to Studio';
  }
  if(p<0.700) return '7 · Studio holds  ◄ poster';
  if(p<0.800) return '8 · the deck  ◄ poster';
  if(p<0.880) return '9 · THE SETTLE — the name changes rank in place';
  if(p<0.958) return '10 · the rail is written under it';
  return '11 · ARRIVED — the column is the margin';
}
function hud(p){
  hudPhase.textContent=phaseName(p);
  hudP.textContent=p.toFixed(3);
  if(document.activeElement!==scrub) scrub.value=String(Math.round(p*1000));
}

let runway=0;
function boot(){
  runway=document.documentElement.scrollHeight-window.innerHeight;
  measure();
  render(clamp(window.scrollY/runway));
}
window.addEventListener('scroll',()=>render(clamp(window.scrollY/runway)),{passive:true});
window.addEventListener('resize',boot);
window.addEventListener('load',boot);
boot();

scrub.addEventListener('input',()=>{ window.scrollTo(0,(+scrub.value/1000)*runway); });
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){ hudEl.hidden=!hudEl.hidden; return; }
  if(e.key==='g'||e.key==='G'){ guidesEl.classList.toggle('on'); boot(); return; }
  const step=runway*0.004;
  if(e.key==='ArrowRight') window.scrollTo(0,window.scrollY+step);
  if(e.key==='ArrowLeft')  window.scrollTo(0,window.scrollY-step);
});
</script>
