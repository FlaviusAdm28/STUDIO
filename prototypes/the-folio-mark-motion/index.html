<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype — The Folio Mark · Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   THE FOLIO MARK — an isolated experiment on the chapter rail.

   Nothing here is read by the site. The rail's rules are copied from
   `src/app/globals.css` (Option A, "Re-setting") with their values intact:
   the folio, the running chapter, the list register, the ink, the halo, the
   11% promote/demote exchange and `TIMING.publication.chapter`'s 660 / 1020 /
   270 ms on the site's one curve.

   ── WHAT CHANGES ─────────────────────────────────────────────────────────
   The head is untouched. The list below it is always all five chapters, in
   canonical order, on fixed lines — no word ever moves to another line. The
   running chapter is not taken out of the list: its line reads its folio and
   a typographic point instead of its word,

       WORK
       ABOUT
       03 ·
       QUESTIONS
       CONTACT

   the way a page number stands where the page is. The point is the only mark
   of state; there is no history, no second register, no scale.

   A change of chapter is the same exchange the site already performs, in
   place: the word leaving the list for the head grows as it goes (promote),
   the folio settles where it was; the word coming back from the head arrives
   still shrinking (demote) where its folio stood. Two lines change. Nothing
   travels, nothing reflows.
   ============================================================================ */

:root {
  --font-cormorant: 'Cormorant Garamond';
  --font-schibsted: 'Schibsted Grotesk';
  --v2-serif: var(--font-cormorant), Georgia, 'Times New Roman', serif;
  --v2-sans: var(--font-schibsted), ui-sans-serif, system-ui, 'Segoe UI', Helvetica, sans-serif;

  /* globals.css, unchanged */
  --mark-x: max(clamp(1.75rem, 5vw, 4.5rem), env(safe-area-inset-left, 0px));
  --mark-y: calc(clamp(2rem, 6vh, 4rem) + env(safe-area-inset-top, 0px));
  --rail-w: 8.25rem;
  --rail: calc(var(--mark-x) + var(--rail-w));
  --curve: cubic-bezier(0.32, 0, 0.24, 1);
  --fade-nav-hover: 240ms;
  --rail-out: 660ms;
  --rail-in: 1020ms;
  --rail-lag: 270ms;

  /* The rail's ink on the film's grounds (--rail-stone = 0). */
  --rail-ink: rgb(242 236 224 / 0.86);
  --rail-ink-quiet: rgb(242 236 224 / 0.62);
  --rail-ink-hover: rgb(242 236 224 / 0.96);
  --rail-halo: 0 0 1px rgb(12 9 6 / 0.3), 0 1px 3px rgb(12 9 6 / 0.26);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: #0c0906; }
body { color: rgb(242 236 224); -webkit-font-smoothing: antialiased; }

/* ── Context: just enough ground to judge the rail on ───────────────────── */
.stage { position: fixed; inset: 0; }
.plate, .plate video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0;
  transition: opacity 900ms var(--curve);
}
.plate { background-size: cover; background-position: center; filter: brightness(0.62) saturate(0.9); }
.plate.on { opacity: 1; }
.plate.video { filter: brightness(0.7); background: #0c0906; }
.plate.video video { opacity: 1; }
.stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgb(12 9 6 / 0.45), rgb(12 9 6 / 0) 32%);
}
.statement {
  position: fixed; left: calc(196 / 1440 * 100vw); top: calc(150 / 760 * 100dvh);
  margin: 0; max-width: 48vw;
  font-family: var(--v2-serif); font-weight: 300;
  font-size: clamp(2rem, calc(52 / 1440 * 100vw), 4.25rem); line-height: 1.08;
  color: rgb(242 236 224 / 0.92); text-shadow: var(--rail-halo);
  opacity: 0; transition: opacity 700ms var(--curve);
}
.statement.on { opacity: 1; transition-delay: 350ms; }

/*
  The scroll mock: five chapters, each a stretch of document, and the running chapter is the one that owns
  the middle of the viewport. Like the site, scroll decides the chapter and a menu press is an instant
  jump to it — nothing else about the site's scroll architecture is reproduced.
*/
.runway section { height: 180vh; }

/* ── THE RAIL · copied from globals.css ─────────────────────────────────── */
.ledger {
  position: fixed; left: 0; z-index: 5;
  top: calc(236 / 760 * 100dvh - var(--mark-y));
  display: flex; flex-direction: column; align-items: flex-start;
  width: var(--rail);
  padding: var(--mark-y) var(--mark-x) clamp(1.25rem, 3vh, 1.75rem);
  padding-left: calc(38 / 1440 * 100vw);
  color: var(--rail-ink);
}
.ledger-rail { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(0.9rem, 1.9vh, 1.25rem); }
.rail-title, .rail-folio, .ledger-word { text-shadow: var(--rail-halo); }

.rail-slot { position: relative; display: block; white-space: nowrap; }
.rail-set { display: inline-block; transform-origin: 0 68%; }
.rail-out { position: absolute; left: 0; top: 0; pointer-events: none; }

.rail-slot[data-swap] > .rail-in { --rail-from: 1; animation: rail-in var(--rail-in) var(--curve) var(--rail-lag) both; }
.rail-slot[data-swap][data-in='promote'] > .rail-in { --rail-from: 0.89; }
.rail-slot[data-swap][data-in='demote'] > .rail-in { --rail-from: 1.11; }
.rail-slot[data-swap] > .rail-out { --rail-to: 1; animation: rail-out var(--rail-out) var(--curve) both; }
.rail-slot[data-swap][data-out='promote'] > .rail-out { --rail-to: 1.11; }
.rail-slot[data-swap][data-out='demote'] > .rail-out { --rail-to: 0.89; }
@keyframes rail-in { from { opacity: 0; transform: scale(var(--rail-from, 1)); } to { opacity: 1; transform: scale(1); } }
@keyframes rail-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(var(--rail-to, 1)); } }

.rail-head { display: block; margin: 0; width: 100%; }
.rail-folio {
  font-family: var(--v2-sans); font-size: clamp(0.5625rem, calc(9.5 / 1440 * 100vw), 0.8125rem);
  font-weight: 400; letter-spacing: 0.26em; text-transform: uppercase; color: var(--rail-ink-quiet);
}
.rail-title {
  display: block; width: 100%; margin-top: 0.34rem;
  font-family: var(--v2-serif); font-weight: 300;
  font-size: clamp(1.5rem, calc(30 / 1440 * 100vw), 2.25rem); line-height: 1.06; color: var(--rail-ink);
}
.ledger-index ul { --row-gap: 0.2rem; display: flex; flex-direction: column; gap: var(--row-gap); margin: 1.55rem 0 0; padding: 0; list-style: none; }
.ledger-index li { display: block; }
.ledger-word {
  appearance: none; display: block; width: 100%; border: 0;
  margin-block: calc(var(--row-gap, 0.2rem) / -2); padding-block: calc(var(--row-gap, 0.2rem) / 2); padding-inline: 0;
  background: none; font-family: var(--v2-sans); font-size: clamp(0.5625rem, calc(9.5 / 1440 * 100vw), 0.8125rem);
  font-weight: 400; letter-spacing: 0.24em; line-height: 1.9; text-transform: uppercase; text-align: left;
  color: var(--rail-ink-quiet); cursor: pointer; transition: color var(--fade-nav-hover) var(--curve);
}
.ledger-word:hover, .ledger-word:focus-visible { color: var(--rail-ink-hover); }
.ledger-word:focus-visible { outline: 1px solid var(--rail-ink-quiet); outline-offset: 0.5rem; }

/* ── THE PROPOSAL · the running chapter's line is its folio and a point ─── */
/*
  Same ink, same size, same tracking as the words around it: the line is not highlighted, it is
  paginated. The point is the page's own — a middle dot in the list's face, set a word-space after the
  folio — so it reads as a mark in the running text of the column rather than as an indicator beside it.
*/
.ledger-word[aria-current] { cursor: default; }
.ledger-word[aria-current]:hover { color: var(--rail-ink-quiet); }
.row-folio { letter-spacing: 0.26em; }
.row-point { margin-left: 0.2em; letter-spacing: 0; }

/* ── MOTION VARIANT · the mark changes page ─────────────────────────────────
   The only difference from the-folio-mark. The words keep the site's exchange exactly; the mark
   is not exchanged like a word — it is re-set on another page. So it leaves the line it was on with
   a breath of travel toward where it is going, and settles on the new line from that same side:

     leaving   the point lifts first, the folio follows — the page is closed from its last mark
     arriving  the folio is set, then the point — a page number, then its full stop

   One curve (the site's), opacity and a 0.3em drift (≈3px) and nothing else: no scale, no spring.
   The arrival waits the exchange's own lag, so the mark settles while the word it replaces is
   already on its way into the head — the two are one change, read in order.
*/
:root {
  --mark-shift: 0.3em;
  --mark-out: 420ms;          /* the folio's departure */
  --mark-point-out: 260ms;    /* the point lifts before it */
  --mark-in: 760ms;           /* the folio's arrival */
  --mark-point-in: 520ms;     /* the point's arrival */
  --mark-point-after: 200ms;  /* how long after the folio the point is set */
}
.rail-set.is-mark .row-folio, .rail-set.is-mark .row-point { display: inline-block; }
/* The mark's own sets take no animation of their own: their parts carry it. */
.rail-slot[data-swap] > .rail-set.is-mark { animation: none; opacity: 1; transform: none; }
/* Direction of travel: down the list when the new chapter is later, up when it is earlier. */
.rail-slot[data-dir='down'] { --mark-from: calc(-1 * var(--mark-shift)); --mark-to: var(--mark-shift); }
.rail-slot[data-dir='up'] { --mark-from: var(--mark-shift); --mark-to: calc(-1 * var(--mark-shift)); }

.rail-slot[data-swap] > .rail-in.is-mark .row-folio {
  animation: mark-in var(--mark-in) var(--curve) var(--rail-lag) both;
}
.rail-slot[data-swap] > .rail-in.is-mark .row-point {
  animation: mark-point-in var(--mark-point-in) var(--curve) calc(var(--rail-lag) + var(--mark-point-after)) both;
}
.rail-slot[data-swap] > .rail-out.is-mark .row-point {
  animation: mark-point-out var(--mark-point-out) var(--curve) both;
}
.rail-slot[data-swap] > .rail-out.is-mark .row-folio {
  animation: mark-folio-out var(--mark-out) var(--curve) 60ms both;
}
@keyframes mark-in {
  from { opacity: 0; transform: translateY(var(--mark-from, 0)); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes mark-point-in {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes mark-point-out {
  from { opacity: 1; }
  to { opacity: 0; }
}
@keyframes mark-folio-out {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(var(--mark-to, 0)); }
}

@media (prefers-reduced-motion: reduce) {
  .rail-slot[data-swap] > .rail-in, .rail-slot[data-swap] > .rail-out { --rail-from: 1; --rail-to: 1; }
  .rail-slot { --mark-from: 0 !important; --mark-to: 0 !important; }
}

/* ── Review harness · not part of the proposal ──────────────────────────── */
.harness {
  position: fixed; right: 16px; bottom: 16px; z-index: 10;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  font: 400 11px/1.3 var(--v2-sans); letter-spacing: 0.04em; color: rgb(242 236 224 / 0.55);
}
.harness .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.harness button {
  font: inherit; color: inherit; background: rgb(12 9 6 / 0.55); border: 1px solid rgb(242 236 224 / 0.16);
  padding: 5px 9px; cursor: pointer; border-radius: 2px;
}
.harness button:hover { color: rgb(242 236 224 / 0.9); }
.harness .log { opacity: 0.8; min-height: 1.3em; }
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="plate" data-for="work" style="background-image:url(/media/projects/venice/venice.png)"></div>
  <div class="plate" data-for="about" style="background-image:url(/media/studio/image19aug26.png)"></div>
  <div class="plate" data-for="method" style="background-image:url(/media/studio/method.png)"></div>
  <div class="plate" data-for="questions" style="background-image:url(/media/studio/method.png);filter:brightness(0.45) saturate(0.85)"></div>
  <div class="plate video" data-for="contact"><video src="/media/hero/video/hero_demo4.mov" muted loop playsinline autoplay></video></div>
</div>

<p class="statement" data-for="work">Wedding experiences</p>
<p class="statement" data-for="about">We stay close<br>to every detail.</p>
<p class="statement" data-for="method">Your experience</p>
<p class="statement" data-for="questions">What do you actually create?</p>
<p class="statement" data-for="contact">Is there something<br>that deserves its own experience?</p>

<main class="runway" aria-hidden="true">
  <section data-chapter="work"></section>
  <section data-chapter="about"></section>
  <section data-chapter="method"></section>
  <section data-chapter="questions"></section>
  <section data-chapter="contact"></section>
</main>

<div class="ledger">
  <div class="ledger-rail">
    <p class="rail-head">
      <span class="rail-slot rail-folio" id="folio"></span>
      <span class="rail-title" aria-current="true"><span class="rail-slot rail-title-slot" id="title"></span></span>
    </p>
    <nav class="ledger-index" aria-label="Chapters"><ul id="rows"></ul></nav>
  </div>
</div>

<div class="harness">
  <div class="row">
    <button type="button" data-reset>Reset</button>
    <button type="button" data-scroll>Scroll through</button>
  </div>
  <div class="row">
    <button type="button" data-seq="work,about,method,questions,contact">Work → About → Method → Questions → Contact</button>
  </div>
  <div class="row">
    <button type="button" data-seq="contact,questions,method,about,work">Contact → Questions → Method → About → Work</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
/* content/site.ts · ledger.destinations — word, folio, canonical order */
const CHAPTERS = [
  { id: 'work', word: 'Work', folio: '01' },
  { id: 'about', word: 'About', folio: '02' },
  { id: 'method', word: 'Method', folio: '03' },
  { id: 'questions', word: 'Questions', folio: '04' },
  { id: 'contact', word: 'Contact', folio: '05' },
]
const byId = Object.fromEntries(CHAPTERS.map((c) => [c.id, c]))

let running = 'work'

const $ = (s) => document.querySelector(s)
const folioEl = $('#folio'), titleEl = $('#title'), rowsEl = $('#rows')

/* ledger.tsx · RailSlot — two settings on one origin, the departing one removed once it has gone */
function setSlot(el, now, was, roleIn, roleOut) {
  el.replaceChildren()
  const swap = was !== null
  if (swap) {
    el.setAttribute('data-swap', '')
    el.dataset.in = roleIn
    el.dataset.out = roleOut
  } else {
    el.removeAttribute('data-swap')
  }
  const inn = document.createElement('span')
  inn.className = 'rail-set rail-in'
  if (typeof now !== 'string') inn.classList.add('is-mark')
  inn.append(now)
  el.append(inn)
  if (swap) {
    const out = document.createElement('span')
    out.className = 'rail-set rail-out'
    out.setAttribute('aria-hidden', 'true')
    const isMark = typeof was !== 'string'
    if (isMark) out.classList.add('is-mark')
    out.append(was)
    /* A mark's parts end at different times; it is gone when its folio is. */
    out.addEventListener('animationend', (e) => {
      if (!isMark || e.animationName === 'mark-folio-out') out.remove()
    })
    el.append(out)
  }
}

/* The running chapter's line: its folio and a typographic point. */
function mark(c) {
  const f = document.createDocumentFragment()
  const n = document.createElement('span')
  n.className = 'row-folio'
  n.textContent = c.folio
  const p = document.createElement('span')
  p.className = 'row-point'
  p.setAttribute('aria-hidden', 'true')
  p.textContent = '·'
  f.append(n, p)
  return f
}

function head(prev) {
  const now = byId[running]
  setSlot(folioEl, now.folio, prev ? byId[prev].folio : null, 'promote', 'demote')
  setSlot(titleEl, now.word, prev ? byId[prev].word : null, 'promote', 'demote')
}

/* ── Five fixed lines in canonical order. A line changes only when it gains or loses the mark. ── */
let rows = null
function list(prev) {
  if (!rows) {
    rowsEl.replaceChildren()
    rows = CHAPTERS.map((c) => {
      const li = document.createElement('li')
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'ledger-word'
      const slot = document.createElement('span')
      slot.className = 'rail-slot rail-word-slot'
      btn.append(slot)
      btn.addEventListener('click', () => navigate(c.id))
      li.append(btn)
      rowsEl.append(li)
      return { c, btn, slot }
    })
  }
  /* Which way the mark travels down the column. */
  const order = (id) => CHAPTERS.findIndex((c) => c.id === id)
  const dir = prev !== null && order(running) < order(prev) ? 'up' : 'down'
  for (const r of rows) {
    r.slot.dataset.dir = dir
    const isRunning = r.c.id === running
    const wasRunning = prev !== null && r.c.id === prev
    r.btn.toggleAttribute('aria-current', isRunning)
    r.btn.setAttribute('aria-label', isRunning ? `${r.c.word}, current chapter` : r.c.word)
    r.btn.tabIndex = isRunning ? -1 : 0
    if (prev === null) {
      setSlot(r.slot, isRunning ? mark(r.c) : r.c.word, null)
    } else if (isRunning) {
      /* The word leaves for the head — it grows as it goes — and the folio settles in its place. */
      setSlot(r.slot, mark(r.c), r.c.word, 'plain', 'promote')
    } else if (wasRunning) {
      /* The word comes back from the head, still shrinking, where its folio stood. */
      setSlot(r.slot, r.c.word, mark(r.c), 'demote', 'plain')
    }
  }
}

function ground() {
  document.querySelectorAll('[data-for]').forEach((el) => el.classList.toggle('on', el.dataset.for === running))
}

function go(id) {
  if (id === running) return
  const prev = running
  running = id
  head(prev)
  list(prev)
  ground()
  $('#log').textContent = `${byId[prev].word} → ${byId[id].word}`
}

/* ── Scroll owns the chapter; a press is a jump that the scroll then reports ── */
const sections = [...document.querySelectorAll('.runway section')]
function chapterAt() {
  const mid = window.scrollY + window.innerHeight / 2
  let hit = sections[0]
  for (const s of sections) if (mid >= s.getBoundingClientRect().top + window.scrollY) hit = s
  return hit.dataset.chapter
}
function navigate(id) {
  const s = sections.find((x) => x.dataset.chapter === id)
  window.scrollTo(0, s.getBoundingClientRect().top + window.scrollY)
}
let frame = 0
window.addEventListener('scroll', () => {
  if (frame) return
  frame = requestAnimationFrame(() => {
    frame = 0
    go(chapterAt())
  })
}, { passive: true })

function reset() {
  clearTimeout(playing)
  window.scrollTo(0, 0)
  running = 'work'
  rows = null
  head(null)
  list(null)
  ground()
  $('#log').textContent = ''
}

/* ── Harness ── */
let playing = null
$('[data-reset]').addEventListener('click', reset)
document.querySelectorAll('[data-seq]').forEach((b) =>
  b.addEventListener('click', () => {
    clearTimeout(playing)
    const seq = b.dataset.seq.split(',')
    if (running !== seq[0]) navigate(seq[0])
    let i = 1
    const next = () => {
      if (i >= seq.length) return
      navigate(seq[i++])
      playing = setTimeout(next, 2400)
    }
    playing = setTimeout(next, 2400)
  }),
)
$('[data-scroll]').addEventListener('click', async () => {
  reset()
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  await wait(900)
  const max = document.documentElement.scrollHeight - window.innerHeight
  while (window.scrollY < max - 5) {
    for (let i = 0; i < 5; i++) {
      window.scrollBy(0, 100)
      await wait(30)
    }
    await wait(450)
  }
})

reset()
</script>
</body>
</html>
