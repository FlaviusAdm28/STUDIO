<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype — The Persistence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   THE PERSISTENCE — an isolated experiment on the chapter rail.

   Nothing here is read by the site. The rail's rules below are copied from
   `src/app/globals.css` (Option A, "Re-setting") with their values intact:
   the folio, the running chapter, the list register, the ink, the halo, the
   11% promote/demote exchange and `TIMING.publication.chapter`'s 660 / 1020 /
   270 ms on the site's one curve. What changes is only the list.

   ── CURRENT ──────────────────────────────────────────────────────────────
   The list is the canonical order with the running chapter taken out. A step
   to the next chapter changes one row; a jump over several changes every row
   between them, and the word that was pressed leaves the list.

   ── PERSISTENT (the proposal) ────────────────────────────────────────────
   The list is always all five, in canonical order, on fixed rows. No row ever
   changes its word, so nothing in the column can rearrange. What changes is
   each row's REGISTER, and there are exactly three. The rail remembers ONE
   chapter — the one immediately before this one — and nothing cumulative:

     current   where I am          the word lifts into the head (unchanged);
                                   its row keeps the faintest impression at
                                   90%, so its place is still marked
     previous  where I came from   94%, ink down to ~0.46 — a memory,
                                   quieter than the list, never a highlight
     normal    where else I can go the list exactly as it is today

   Every navigation replaces the previous chapter: the one leaving the head
   becomes it, and the one that was it returns to normal. So a change of
   chapter is one movement read in place — the pressed word grows into the
   head while its row settles to an impression, the word leaving the head
   shrinks away while its own row takes the previous ink, and the old memory
   quietly returns to the list. Nothing crosses the column. Nothing reflows.
   ============================================================================ */

:root {
  --font-cormorant: 'Cormorant Garamond';
  --font-schibsted: 'Schibsted Grotesk';
  --v2-serif: var(--font-cormorant), Georgia, 'Times New Roman', serif;
  --v2-sans: var(--font-schibsted), ui-sans-serif, system-ui, 'Segoe UI', Helvetica, sans-serif;

  /* globals.css, unchanged */
  --mark-x: max(clamp(1.75rem, 5vw, 4.5rem), env(safe-area-inset-left, 0px));
  --mark-y: calc(clamp(2rem, 6vh, 4rem) + env(safe-area-inset-top, 0px));
  --rail-w: 8.25rem;
  --rail: calc(var(--mark-x) + var(--rail-w));
  --curve: cubic-bezier(0.32, 0, 0.24, 1);
  --fade-nav-hover: 240ms;
  --rail-out: 660ms;
  --rail-in: 1020ms;
  --rail-lag: 270ms;

  /* The rail's ink on the film's grounds (--rail-stone = 0). */
  --rail-ink: rgb(242 236 224 / 0.86);
  --rail-ink-quiet: rgb(242 236 224 / 0.62);
  --rail-ink-hover: rgb(242 236 224 / 0.96);
  --rail-halo: 0 0 1px rgb(12 9 6 / 0.3), 0 1px 3px rgb(12 9 6 / 0.26);

  /* ── The proposal's two new registers. Everything else is inherited. ── */
  --rail-ink-previous: rgb(242 236 224 / 0.46);
  --rail-ink-trace: rgb(242 236 224 / 0.12);
  --rail-previous-scale: 0.94;
  --rail-trace-scale: 0.9;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: #0c0906; }
/*
  The scroll mock: five chapters, each a stretch of document, and the running chapter is the one that owns
  the middle of the viewport. Like the site, scroll decides the chapter and a menu press is an instant
  jump to it — nothing else about the site's scroll architecture is reproduced.
*/
.runway section { height: var(--chapter-h, 180vh); }
body { color: rgb(242 236 224); -webkit-font-smoothing: antialiased; }

/* ── Context: just enough ground to judge the rail on ───────────────────── */
.stage { position: fixed; inset: 0; }
.plate, .plate video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0;
  transition: opacity 900ms var(--curve);
}
.plate { background-size: cover; background-position: center; filter: brightness(0.62) saturate(0.9); }
.plate.on { opacity: 1; }
.plate.video { filter: brightness(0.7); background: #0c0906; }
.plate.video video { opacity: 1; }
.stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgb(12 9 6 / 0.45), rgb(12 9 6 / 0) 32%);
}
.statement {
  position: fixed; left: calc(196 / 1440 * 100vw); top: calc(150 / 760 * 100dvh);
  margin: 0; max-width: 48vw;
  font-family: var(--v2-serif); font-weight: 300;
  font-size: clamp(2rem, calc(52 / 1440 * 100vw), 4.25rem); line-height: 1.08;
  color: rgb(242 236 224 / 0.92); text-shadow: var(--rail-halo);
  opacity: 0; transition: opacity 700ms var(--curve);
}
.statement.on { opacity: 1; transition-delay: 350ms; }

/* ── THE RAIL · copied from globals.css ─────────────────────────────────── */
.ledger {
  position: fixed; left: 0; z-index: 5;
  top: calc(236 / 760 * 100dvh - var(--mark-y));
  display: flex; flex-direction: column; align-items: flex-start;
  width: var(--rail);
  padding: var(--mark-y) var(--mark-x) clamp(1.25rem, 3vh, 1.75rem);
  padding-left: calc(38 / 1440 * 100vw);
  color: var(--rail-ink);
}
.ledger-rail { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(0.9rem, 1.9vh, 1.25rem); }
.rail-title, .rail-folio, .ledger-word { text-shadow: var(--rail-halo); }

.rail-slot { position: relative; display: block; white-space: nowrap; }
.rail-set { display: inline-block; transform-origin: 0 68%; }
.rail-out { position: absolute; left: 0; top: 0; pointer-events: none; }

.rail-slot[data-swap] > .rail-in { --rail-from: 1; animation: rail-in var(--rail-in) var(--curve) var(--rail-lag) both; }
.rail-slot[data-swap][data-in='promote'] > .rail-in { --rail-from: 0.89; }
.rail-slot[data-swap][data-in='demote'] > .rail-in { --rail-from: 1.11; }
.rail-slot[data-swap] > .rail-out { --rail-to: 1; animation: rail-out var(--rail-out) var(--curve) both; }
.rail-slot[data-swap][data-out='promote'] > .rail-out { --rail-to: 1.11; }
.rail-slot[data-swap][data-out='demote'] > .rail-out { --rail-to: 0.89; }
@keyframes rail-in { from { opacity: 0; transform: scale(var(--rail-from, 1)); } to { opacity: 1; transform: scale(1); } }
@keyframes rail-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(var(--rail-to, 1)); } }

.rail-head { display: block; margin: 0; width: 100%; }
.rail-folio {
  font-family: var(--v2-sans); font-size: clamp(0.5625rem, calc(9.5 / 1440 * 100vw), 0.8125rem);
  font-weight: 400; letter-spacing: 0.26em; text-transform: uppercase; color: var(--rail-ink-quiet);
}
.rail-title {
  display: block; width: 100%; margin-top: 0.34rem;
  font-family: var(--v2-serif); font-weight: 300;
  font-size: clamp(1.5rem, calc(30 / 1440 * 100vw), 2.25rem); line-height: 1.06; color: var(--rail-ink);
}
.ledger-index ul { --row-gap: 0.2rem; display: flex; flex-direction: column; gap: var(--row-gap); margin: 1.55rem 0 0; padding: 0; list-style: none; }
.ledger-index li { display: block; }
.ledger-word {
  appearance: none; display: block; width: 100%; border: 0;
  margin-block: calc(var(--row-gap, 0.2rem) / -2); padding-block: calc(var(--row-gap, 0.2rem) / 2); padding-inline: 0;
  background: none; font-family: var(--v2-sans); font-size: clamp(0.5625rem, calc(9.5 / 1440 * 100vw), 0.8125rem);
  font-weight: 400; letter-spacing: 0.24em; line-height: 1.9; text-transform: uppercase; text-align: left;
  color: var(--rail-ink-quiet); cursor: pointer; transition: color var(--fade-nav-hover) var(--curve);
}
.ledger-word:hover, .ledger-word:focus-visible { color: var(--rail-ink-hover); }
.ledger-word:focus-visible { outline: 1px solid var(--rail-ink-quiet); outline-offset: 0.5rem; }

/* ── THE PROPOSAL · the list's three registers ──────────────────────────── */
/*
  **At rest a row answers at the site's hover speed**, in and out, whatever register it is in.

  **The navigation windows belong to a row only while its register is changing** — `data-settling`, set
  by the script on the rows a navigation changes and removed when their window has run. Without that
  scope the previous row's own rule carried the arrival window, so a pointer leaving it waited out
  --rail-lag and faded back over --rail-in: ~1.2s of a bright word after the hand had gone.
*/
.persistent .ledger-word,
.persistent .ledger-word .rail-set {
  transition: color var(--fade-nav-hover) var(--curve), transform var(--fade-nav-hover) var(--curve);
}
/*
  A row's register moves on the same windows the head's exchange uses, so the two halves of one change
  land together: the row a word is promoted OUT of settles over the head's departure (--rail-out), and
  the row the departing word returns TO takes its ink on the arrival (--rail-in after --rail-lag).
*/
.persistent .ledger-word[data-settling],
.persistent .ledger-word[data-settling] .rail-set {
  transition: color var(--rail-in) var(--curve) var(--rail-lag), transform var(--rail-in) var(--curve) var(--rail-lag);
}
.persistent .ledger-word[data-settling][data-register='current'],
.persistent .ledger-word[data-settling][data-register='current'] .rail-set {
  transition-duration: var(--rail-out);
  transition-delay: 0ms;
}
/*
  A memory lets go as soon as it is replaced: a row returning to normal does it on the head's departure
  window, with no lag, so rapid navigation never leaves a trail of rows still on their way back.
*/
.persistent .ledger-word[data-settling][data-register='normal'],
.persistent .ledger-word[data-settling][data-register='normal'] .rail-set {
  transition-duration: var(--rail-out);
  transition-delay: 0ms;
}
.persistent .ledger-word[data-register='previous'] { color: var(--rail-ink-previous); }
.persistent .ledger-word[data-register='previous'] .rail-set { transform: scale(var(--rail-previous-scale)); }
.persistent .ledger-word[data-register='current'] { color: var(--rail-ink-trace); cursor: default; }
.persistent .ledger-word[data-register='current'] .rail-set { transform: scale(var(--rail-trace-scale)); }
/* Hover answers at the site's hover speed whatever register the row is in. */
.persistent .ledger-word:not([data-register='current']):hover,
.persistent .ledger-word:not([data-register='current']):focus-visible {
  color: var(--rail-ink-hover); transition: color var(--fade-nav-hover) var(--curve);
}

@media (prefers-reduced-motion: reduce) {
  .rail-slot[data-swap] > .rail-in, .rail-slot[data-swap] > .rail-out { --rail-from: 1; --rail-to: 1; }
  .persistent .ledger-word .rail-set { transform: none !important; }
}

/* ── Review harness · not part of the proposal ──────────────────────────── */
.harness {
  position: fixed; right: 16px; bottom: 16px; z-index: 10;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  font: 400 11px/1.3 var(--v2-sans); letter-spacing: 0.04em; color: rgb(242 236 224 / 0.55);
}
.harness .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.harness button {
  font: inherit; color: inherit; background: rgb(12 9 6 / 0.55); border: 1px solid rgb(242 236 224 / 0.16);
  padding: 5px 9px; cursor: pointer; border-radius: 2px;
}
.harness button:hover { color: rgb(242 236 224 / 0.9); }
.harness button[aria-pressed='true'] { color: rgb(242 236 224 / 0.95); border-color: rgb(242 236 224 / 0.5); }
.harness .log { opacity: 0.8; min-height: 1.3em; }
</style>
</head>
<body class="persistent">

<div class="stage" aria-hidden="true">
  <div class="plate" data-for="work" style="background-image:url(/media/projects/venice/venice.png)"></div>
  <div class="plate" data-for="about" style="background-image:url(/media/studio/image19aug26.png)"></div>
  <div class="plate" data-for="method" style="background-image:url(/media/studio/method.png)"></div>
  <div class="plate" data-for="questions" style="background-image:url(/media/studio/method.png);filter:brightness(0.45) saturate(0.85)"></div>
  <div class="plate video" data-for="contact"><video src="/media/hero/video/hero_demo4.mov" muted loop playsinline autoplay></video></div>
</div>

<p class="statement" data-for="work">Wedding experiences</p>
<p class="statement" data-for="about">We stay close<br>to every detail.</p>
<p class="statement" data-for="method">Your experience</p>
<p class="statement" data-for="questions">What do you actually create?</p>
<p class="statement" data-for="contact">Is there something<br>that deserves its own experience?</p>

<main class="runway" aria-hidden="true">
  <section data-chapter="work"></section>
  <section data-chapter="about"></section>
  <section data-chapter="method"></section>
  <section data-chapter="questions"></section>
  <section data-chapter="contact"></section>
</main>

<div class="ledger">
  <div class="ledger-rail">
    <p class="rail-head">
      <span class="rail-slot rail-folio" id="folio"></span>
      <span class="rail-title" aria-current="true"><span class="rail-slot rail-title-slot" id="title"></span></span>
    </p>
    <nav class="ledger-index" aria-label="Chapters"><ul id="rows"></ul></nav>
  </div>
</div>

<div class="harness">
  <div class="row">
    <button type="button" data-variant="current" aria-pressed="false">Current</button>
    <button type="button" data-variant="persistent" aria-pressed="true">Persistent</button>
    <button type="button" data-reset>Reset</button>
  </div>
  <div class="row">
    <span>Previous scale</span>
    <button type="button" data-scale="A" data-value="1">A · 100%</button>
    <button type="button" data-scale="B" data-value="0.94">B · 94%</button>
    <button type="button" data-scale="C" data-value="0.92">C · 92%</button>
  </div>
  <div class="row">
    <button type="button" data-seq="work,about,method,questions,contact">Work → About → Method → Questions → Contact</button>
    <button type="button" data-seq="contact,work">Contact → Work</button>
    <button type="button" data-scroll>Scroll through</button>
  </div>
  <div class="row">
    <button type="button" data-seq="contact,questions,method,about,work">Contact → Questions → Method → About → Work</button>
  </div>
  <div class="row">
    <button type="button" data-seq="work,questions,contact,work,about,contact">Work → Questions → Contact → Work → About → Contact</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
/* content/site.ts · ledger.destinations — word, folio, canonical order */
const CHAPTERS = [
  { id: 'work', word: 'Work', folio: '01' },
  { id: 'about', word: 'About', folio: '02' },
  { id: 'method', word: 'Method', folio: '03' },
  { id: 'questions', word: 'Questions', folio: '04' },
  { id: 'contact', word: 'Contact', folio: '05' },
]
const byId = Object.fromEntries(CHAPTERS.map((c) => [c.id, c]))

let variant = 'persistent'
let running = 'work'
/* The rail's whole memory: the chapter immediately before this one. Replaced on every navigation. */
let previous = null

const $ = (s) => document.querySelector(s)
const folioEl = $('#folio'), titleEl = $('#title'), rowsEl = $('#rows')

/* ledger.tsx · RailSlot — two settings on one origin, the departing one removed once it has gone */
function setSlot(el, now, was, roleIn, roleOut) {
  el.replaceChildren()
  if (was === null || was === now) {
    el.removeAttribute('data-swap')
  } else {
    el.setAttribute('data-swap', '')
    el.dataset.in = roleIn
    el.dataset.out = roleOut
  }
  const inn = document.createElement('span')
  inn.className = 'rail-set rail-in'
  inn.textContent = now
  el.append(inn)
  if (was !== null && was !== now) {
    const out = document.createElement('span')
    out.className = 'rail-set rail-out'
    out.setAttribute('aria-hidden', 'true')
    out.textContent = was
    out.addEventListener('animationend', () => out.remove(), { once: true })
    el.append(out)
  }
}

function head(prev) {
  const now = byId[running]
  setSlot(folioEl, now.folio, prev ? byId[prev].folio : null, 'promote', 'demote')
  setSlot(titleEl, now.word, prev ? byId[prev].word : null, 'promote', 'demote')
}

/* ── CURRENT · ledger.tsx `compose`, ported: canonical order with the running chapter taken out ── */
let currentRows = []
function composeCurrent(prev) {
  const listed = CHAPTERS.filter((c) => c.id !== running)
  const wasHeader = prev ? byId[prev].word : null
  const first = currentRows.length === 0
  if (first) {
    rowsEl.replaceChildren()
    currentRows = listed.map(() => {
      const li = document.createElement('li')
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'ledger-word'
      const slot = document.createElement('span')
      slot.className = 'rail-slot rail-word-slot'
      btn.append(slot)
      li.append(btn)
      rowsEl.append(li)
      return { btn, slot, word: null }
    })
  }
  listed.forEach((c, i) => {
    const row = currentRows[i]
    row.btn.onclick = () => navigate(c.id)
    if (row.word === c.word) return
    const roleIn = wasHeader !== null && c.word === wasHeader ? 'demote' : 'plain'
    const roleOut = row.word === byId[running].word ? 'promote' : 'plain'
    setSlot(row.slot, c.word, row.word, roleIn, roleOut)
    row.word = c.word
  })
}

/* ── PERSISTENT · five fixed rows; only the register changes ── */
let persistentRows = null
function composePersistent() {
  if (!persistentRows) {
    rowsEl.replaceChildren()
    persistentRows = CHAPTERS.map((c) => {
      const li = document.createElement('li')
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'ledger-word'
      btn.innerHTML = `<span class="rail-slot"><span class="rail-set">${c.word}</span></span>`
      btn.onclick = () => navigate(c.id)
      li.append(btn)
      rowsEl.append(li)
      return { id: c.id, btn }
    })
  }
  /* The navigation windows, read from the stylesheet rather than restated. */
  const ms = (name) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0
  for (const r of persistentRows) {
    const register = r.id === running ? 'current' : r.id === previous ? 'previous' : 'normal'
    const was = r.btn.dataset.register
    if (was !== undefined && was !== register) {
      /* Settling for exactly its own window: arrival (lag + in) into previous, departure otherwise. */
      clearTimeout(r.settle)
      r.btn.setAttribute('data-settling', '')
      const span = register === 'previous' ? ms('--rail-lag') + ms('--rail-in') : ms('--rail-out')
      r.settle = setTimeout(() => r.btn.removeAttribute('data-settling'), span)
    }
    r.btn.dataset.register = register
    r.btn.toggleAttribute('aria-current', register === 'current')
    r.btn.tabIndex = register === 'current' ? -1 : 0
  }
}

/* ── Scroll owns the chapter; a press is a jump that the scroll then reports ── */
const sections = [...document.querySelectorAll('.runway section')]
function chapterAt() {
  const mid = window.scrollY + window.innerHeight / 2
  /* The last section whose top the middle has passed — gapless, whatever the sub-pixel rounding. */
  let hit = sections[0]
  for (const s of sections) if (mid >= s.getBoundingClientRect().top + window.scrollY) hit = s
  return hit.dataset.chapter
}
function navigate(id) {
  const s = sections.find((x) => x.dataset.chapter === id)
  window.scrollTo(0, s.offsetTop)
}
let frame = 0
window.addEventListener('scroll', () => {
  if (frame) return
  frame = requestAnimationFrame(() => {
    frame = 0
    go(chapterAt())
  })
}, { passive: true })

function ground() {
  document.querySelectorAll('[data-for]').forEach((el) => el.classList.toggle('on', el.dataset.for === running))
}

function go(id) {
  if (id === running) return
  const prev = running
  previous = prev
  running = id
  head(prev)
  variant === 'persistent' ? composePersistent() : composeCurrent(prev)
  ground()
  $('#log').textContent = `${byId[prev].word} → ${byId[id].word}`
}

function reset() {
  window.scrollTo(0, 0)
  running = 'work'
  previous = null
  currentRows = []
  persistentRows = null
  head(null)
  variant === 'persistent' ? composePersistent() : composeCurrent(null)
  ground()
  $('#log').textContent = ''
}

/* ── Harness ── */
document.querySelectorAll('[data-variant]').forEach((b) =>
  b.addEventListener('click', () => {
    variant = b.dataset.variant
    document.body.classList.toggle('persistent', variant === 'persistent')
    document.querySelectorAll('[data-variant]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
    reset()
  }),
)
$('[data-reset]').addEventListener('click', reset)

/* PREVIOUS scale variants — the only thing they change is --rail-previous-scale. `?previous=B` preselects. */
function scaleVariant(key) {
  const b = document.querySelector(`[data-scale="${key}"]`) ?? document.querySelector('[data-scale="A"]')
  document.documentElement.style.setProperty('--rail-previous-scale', b.dataset.value)
  document.querySelectorAll('[data-scale]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
  document.title = `Prototype — The Persistence · ${b.textContent}`
}
document.querySelectorAll('[data-scale]').forEach((b) => b.addEventListener('click', () => scaleVariant(b.dataset.scale)))
scaleVariant(new URLSearchParams(location.search).get('previous') ?? 'B')

/* One normal scroll through every chapter: wheel-like bursts of five notches, a pause between. */
$('[data-scroll]').addEventListener('click', async () => {
  clearTimeout(playing)
  reset()
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  await wait(900)
  const max = document.documentElement.scrollHeight - window.innerHeight
  while (window.scrollY < max - 5) {
    for (let i = 0; i < 5; i++) {
      window.scrollBy(0, 100)
      await wait(30)
    }
    await wait(450)
  }
})

let playing = null
document.querySelectorAll('[data-seq]').forEach((b) =>
  b.addEventListener('click', () => {
    clearTimeout(playing)
    const seq = b.dataset.seq.split(',')
    /* Start from the sequence's first chapter, as if the visitor were there already. */
    if (running !== seq[0]) navigate(seq[0])
    let i = 1
    const next = () => {
      if (i >= seq.length) return
      navigate(seq[i++])
      playing = setTimeout(next, 2400)
    }
    playing = setTimeout(next, 2400)
  }),
)

reset()
</script>
</body>
</html>
