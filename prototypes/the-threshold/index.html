<meta charset="utf-8">
<title>Prototype — The Threshold</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   THE THRESHOLD — 3003

   A different intention, not a fourth tuning of the same one.

   3000, 3001 and 3002 all compose this stretch as an ENDING: a poster frame, a
   hold, a finished composition. It is not an ending. In the real film `Studio`
   is state 08 and the very next thing on screen is state 09 — the work itself.
   The sentence is the last line of Chapter II; `Studio` is the door into
   Chapter III. Every version so far has built a monument and then had to
   dismantle it to let the navigation in, which is why that junction never felt
   right in any of them: we were undoing something that should never have been
   built as a monument.

   THE IDEA: **the studio speaks, then stops, and when it stops you see.**

   Four consequences, and they are the whole design:

     1  THE PAGE HAS A COLUMN. All studio type lives in a soft left field that is
        present from the first frame; the photograph's subject lives to the right
        of it. That single decision replaces the veil, the deck's wipe, and the
        sentence colliding with the couple — three problems we were treating
        separately that were all the same pagination problem.

     2  LANGUAGE RECEDES AND THE IMAGE ADVANCES. The exposure is coupled to the
        consumption: every word that leaves buys light. The most inert stretch in
        the other versions becomes the most meaningful one, and it costs nothing.

     3  THE SILENCE IS THE PEAK. `chapter` goes, and for ~320px there is no type
        at all — the photograph at its brightest, the camera still moving in.
        This is the only moment in the piece where you simply look, and the only
        moment the couple are unambiguously the subject. In every other version
        they are background texture.

     4  THE CARD IS NEVER DISMANTLED. `Studio` arrives at the column's margin and
        stays. The chapter numeral and the destinations take the column beneath
        it. Nothing shrinks, nothing travels into a menu, nothing fades out to
        make room. It is a chapter title page, and the work scrolls up over it.

   WHAT IS GONE ON PURPOSE: the veil, the deck's wipe, the mark's draw/fall/stack
   performance, the staggered index, the lateral recompose, and the centred
   title card. Each was craft solving a problem the pagination now removes.
   ========================================================================= */

:root{
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
  --ink: #f2ece0;
  --ink-quiet: rgb(242 236 224 / .60);

  /* The sentence, and the survivor never changes size — the promotion is weight
     and letterspacing, not scale. */
  --sent: clamp(1.25rem, calc(52 / 1440 * 100vw), 4.25rem);
  --deck-size: clamp(0.8rem, calc(31 / 1440 * 100vw), 2.05rem);
  --nav-size: clamp(0.9rem, calc(15 / 1440 * 100vw), 1rem);
  --folio-size: clamp(0.7rem, calc(12 / 1440 * 100vw), 0.8125rem);

  /* THE COLUMN. Everything the studio says begins here and nothing is centred.
     It is the Ledger's own margin in the real build, so the voice speaks from
     the first frame in the place the navigation will eventually live. */
  --col-x: max(6vw, 1.75rem);

  /* The line the sentence stands on. Not 50%: at dead centre the type sits on
     the couple's own band and the frame has no top or bottom. At 54 it rides
     the water, under their heads, and leaves the architecture the upper third. */
  --base-y: 54%;

  --curve: cubic-bezier(.22,.61,.36,1);
}

/* Mobile keeps the same page, tightened. The name is 1.68x the deck on desktop,
   which is what lets one word hold a frame against six; at 4.5vw that ratio
   collapses to 1.36 and the deck becomes the loudest thing on screen. */
@media (max-width: 820px){
  :root{ --sent: clamp(1.05rem, 5vw, 1.6rem); --col-x: 6vw; --base-y: 56% }
}

*{box-sizing:border-box}
html{background:#000}
body{
  margin:0; background:#050505; color:var(--ink);
  font-family:var(--serif); font-weight:300;
  -webkit-font-smoothing:antialiased;
}
.runway{height:900vh}
.stage{position:fixed; inset:0; overflow:hidden; background:#050505}

/* ---------------------------------------------------------------- the plate */
/* ONE CAMERA MOVE, AND IT MEANS SOMETHING: a slow push toward the couple, so
   that as the studio says less the frame closes on them. It replaces the
   lateral recompose entirely — that move existed to clear a field for the
   navigation, and the column already is that field, so the pan had no work left
   to do. Nine per cent over the whole piece is a lens breathing, not a zoom.

   The origin is the couple, not the frame's centre. That is the difference
   between a push and a scale: the frame moves toward a subject. */
.plate{
  position:absolute; inset:0;
  background-image:url('/media/projects/venice/venice.png');
  background-size:cover; background-position:center 42%;
  transform-origin:72% 46%;
  will-change:transform,filter;
}
/* `center 42%` is authored for a landscape frame. On a portrait one it bisects
   the woman on the right margin, and the couple are the reason this photograph
   is in the film. The push origin follows the crop. */
@media (max-width: 820px){
  .plate{ background-position:62% 42%; transform-origin:64% 46% }
}

/* ------------------------------------------------------------- THE COLUMN */
/* Not a panel and not a vignette — a fall of light across the frame, present
   from the first frame and never announced.

   This is the piece's single biggest structural change. In the other versions a
   grade like this appeared only at the end, to rescue the navigation from the
   sunlit water; here it is the PAGE, and every line the studio speaks stands on
   it. The type needs no veil because it already has a ground, the deck needs no
   wipe because it is not fighting for legibility, and the sentence never
   collides with the couple because it was never in their half of the frame.

   Stops out to 92% so the fall is long: a short ramp reads as a rectangle lying
   on the photograph, which is exactly what it must never look like. 96deg
   rather than 90 so the density leans very slightly into the lower left, which
   is where the sun's specular track on the water actually is. */
.column{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(96deg,
    rgba(5,5,7,.80) 0%, rgba(5,5,7,.66) 24%, rgba(5,5,7,.38) 50%,
    rgba(5,5,7,.14) 74%, rgba(5,5,7,0) 92%);
  will-change:opacity;
}

/* ------------------------------------------------------------- the sentence */
/* LEFT-ALIGNED, and that is the whole of the pagination. It is not a title
   card centred on a photograph; it is a column of type with a photograph beside
   it, which is what an editorial page is. */
.line{
  position:absolute; left:var(--col-x); top:var(--base-y);
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:var(--sent); line-height:1.1;
  color:rgb(240 230 214 / .82);
}
.line .w{ position:absolute; top:0; will-change:opacity }

/* --------------------------------------------------------------- the name */
/* Both words hang from the same left edge at the same size. Left-aligned, the
   exchange needs none of the ink-mass correction a centred one does: the two
   words share an origin rather than a midpoint, so they cannot drift against
   each other. One fewer measured constant, and the same result. */
.name{ position:absolute; left:var(--col-x); top:var(--base-y); height:0 }
.name span{
  position:absolute; left:0; top:0;
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:var(--sent); line-height:1.1;
  will-change:opacity;
}
#from{ font-weight:300; color:rgb(240 230 214 / .82) }
/* The promotion: same face, same weight, same size, same place. The only thing
   that changes is that the word opens its letterspacing and comes to full ink —
   a word settling into a name, not a word being emboldened. */
#to{ font-weight:300; letter-spacing:.06em; color:var(--ink) }

/* ---------------------------------------------------- the chapter's folio */
/* The running head a book puts in the corner. It is not a title and it never
   becomes one — the studio is the protagonist of its own page and the numeral
   is what files that page in the book. No strokes, no drawing, no falling: a
   numeral is a numeral. */
.folio{
  position:absolute; left:var(--col-x);
  top:calc(var(--base-y) - var(--sent) * 0.92);
  font-family:var(--sans); font-weight:500;
  font-size:var(--folio-size); letter-spacing:.34em;
  color:rgb(242 236 224 / .46);
  will-change:opacity;
}

/* ------------------------------------------------------------------ the deck */
/* No veil and no wipe. It stands on the column like everything else, and it is
   set to be read rather than rescued: 500 because only 300 and 500 are loaded,
   so 400 would be synthesised, and .075em because opening the glyphs is what
   lets a serif this fine hold its shape at this size. */
.deck{
  position:absolute; left:var(--col-x);
  top:calc(var(--base-y) + var(--sent) * 0.78);
  margin:0; white-space:nowrap;
  font-family:var(--serif); font-weight:500;
  font-size:var(--deck-size); letter-spacing:.075em;
  color:var(--ink);
  will-change:opacity;
}

/* ------------------------------------------------------------- the index */
/* IT ARRIVES AS ONE BLOCK. Five rows lighting one after another is a menu
   animation, and every website has one; furniture does not make an entrance.
   It also lands on the deck's own line, so the caption is not removed to make
   room for a list — the list simply takes the slot the caption was holding. */
.index{
  position:absolute; left:var(--col-x);
  top:calc(var(--base-y) + var(--sent) * 0.78);
  font-family:var(--sans); font-size:var(--nav-size);
  will-change:opacity;
}
.index ul{ display:flex; flex-direction:column; gap:.62rem; margin:0; padding:0; list-style:none }
.index li{ display:flex; align-items:baseline; gap:.5rem }
.index a, .index button{
  appearance:none; border:0; background:none; font:inherit;
  margin-block:-.4rem; padding:.4rem 0;
  font-weight:500; letter-spacing:.06em;
  color:var(--ink-quiet); text-align:left; text-decoration:none; cursor:pointer;
  transition:color 420ms var(--curve);
}
.index a:hover, .index button:hover{ color:var(--ink) }

/* ------------------------------------------------------------- review tools */
.hud{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  font-family:var(--sans); font-size:11px; letter-spacing:.06em;
  color:#9b958a; background:rgba(0,0,0,.72);
  padding:7px 12px 9px; display:flex; gap:14px; align-items:center;
  backdrop-filter:blur(6px);
}
.hud[hidden]{display:none!important}
.hud .phase{color:#f2ece0; min-width:280px; text-transform:uppercase}
.hud .p{min-width:64px}
.hud input{flex:1; accent-color:#f2ece0}
.hud .hint{opacity:.55}
</style>

<div class="stage">
  <div class="plate" id="plate"></div>
  <div class="column" id="column"></div>

  <div class="line" id="line"></div>

  <div class="name">
    <span id="from">chapter</span><span id="to">Studio</span>
  </div>

  <div class="folio" id="folio">III</div>
  <p class="deck" id="deck">What we actually make</p>

  <nav class="index" id="index">
    <ul>
      <li><button>Work</button></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Method</a></li>
      <li><a href="#">Questions</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</div>

<div class="runway"></div>

<div class="hud" id="hud">
  <span class="phase" id="hudPhase">—</span>
  <span class="p" id="hudP">0.000</span>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span class="hint">H hud · ←/→ step · drag to scrub</span>
</div>

<script>
/* ===========================================================================
   Choreography
   =========================================================================== */

/* The full stop. `Some moments deserve another chapter` without it is a caption,
   and the piece is not captioning a photograph. It leaves at the hand-over —
   while the line is being eaten, the words receding leave `another chapter.`
   standing, which still reads as a complete thought precisely because the
   period is there. */
const WORDS=['Some','moments','deserve','another','chapter'];
const STOP='.';
const KEEPER=4, PERIOD=5;

/* THE MAP.

   Read it as three acts and a page:

     the studio speaks   .000 – .430   the line arrives, holds, and is eaten
     the studio stops    .430 – .620   the phrase, the hand-over, the last word
     you look            .620 – .690   THE SILENCE — no type at all
     the page            .690 – 1.00   the name, the folio, the way in

   The proportions are deliberately the inverse of every previous version: there
   the consumption was the longest thing and the arrival the shortest. */
const PH={
  arrives   :[0.000,0.060],
  holds     :[0.060,0.140],

  /* THE CONSUMPTION. Three words, left to right, each owning most of its own
     channel — the line is left behind rather than switched off, and it empties
     from the left, which is the direction the reading came from. */
  consumes  :[0.140,0.430],

  /* THE PHRASE. The one long hold before the silence, and the first place the
     photograph is bright enough for the couple to be found. */
  phrase    :[0.430,0.520],

  /* `another` goes and the line closes once more, so the survivor ends at the
     column's own margin — where `Studio` will stand. */
  anotherOut:[0.520,0.575],
  stopOut   :[0.520,0.568],
  alone     :[0.575,0.620],

  /* THE EXCHANGE — see DIP. Only its start is read. */
  exchange  :[0.620,0.700],

  /* THE PAGE. Nothing here is dismantled to make room for anything else. */
  folioIn   :[0.706,0.752],
  deckIn    :[0.780,0.836],
  deckOut   :[0.880,0.918],
  indexIn   :[0.924,0.964],
  /* .964 – 1.000 the page complete, the camera still. */
};

/* THE EXCHANGE, IN PIXELS OF SCROLL, because a silence is a duration the hand
   feels and it must not change length when the runway is priced differently.

   90 / 320 / 90. The fades are the same order as every version we tested; THE
   GAP IS THE CHANGE. It was 30 authored (~56px seen) — half a wheel tick, a
   held breath. At 320 it is a held FRAME: three and a bit turns of the wheel in
   which there is no type anywhere on screen, the exposure is at its highest and
   the camera is still closing on the couple.

   That is the whole argument of this version. Every other one gave its longest
   stretch to three words fading and its shortest to the thing it was building
   toward. */
const DIP={out:90, gap:320, in:90};

const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const t=(p,[a,b])=>clamp((p-a)/(b-a));
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;

function dip(){
  const s=PH.exchange[0], k=1/(runway||1);
  const outEnd=s+DIP.out*k, inStart=outEnd+DIP.gap*k;
  return {start:s, outEnd, inStart, inEnd:inStart+DIP.in*k};
}

/* EXPOSURE — the coupling this version is built on.

   Every word that leaves buys light. The line arrives on a room held down, the
   consumption opens it, the phrase opens it further, and the silence is the
   brightest frame in the piece. Then it settles: rooms you enter get quieter,
   not brighter, and the name should not have to compete with the photograph it
   is signing.

   The floor is .38, not 3000's .132. At .132 the photograph is a texture and
   the couple are invisible — and the line is ABOUT a moment. Erasing the moment
   in order to say the sentence is the wrong trade, and it is the single biggest
   thing the other versions get wrong. */
const EXPOSURE=[
  [0.000,0.38],[0.060,0.42],[0.140,0.42],[0.430,0.68],
  [0.520,0.78],[0.620,0.86],[0.690,0.92],[0.790,0.86],[1.000,0.84],
];
function exposureAt(p){
  for(let i=1;i<EXPOSURE.length;i++){
    if(p<=EXPOSURE[i][0]){
      const [a,av]=EXPOSURE[i-1],[b,bv]=EXPOSURE[i];
      return lerp(av,bv,easeInOut(clamp((p-a)/(b-a))));
    }
  }
  return EXPOSURE[EXPOSURE.length-1][1];
}

const lineEl=document.getElementById('line');
const fromEl=document.getElementById('from');
const toEl=document.getElementById('to');
const folioEl=document.getElementById('folio');
const deckEl=document.getElementById('deck');
const indexEl=document.getElementById('index');
const plateEl=document.getElementById('plate');
const columnEl=document.getElementById('column');
let M=null;

/* ===========================================================================
   Measure once.
   =========================================================================== */
function measure(){
  lineEl.style.width=''; lineEl.style.height=''; lineEl.style.transform='';
  lineEl.innerHTML =
    WORDS.map((w,i)=>`<span class="w" data-i="${i}">${w}</span>`).join(' ') +
    `<span class="w" data-i="${PERIOD}">${STOP}</span>`;
  const spans=[...lineEl.querySelectorAll('.w')];
  spans.forEach(s=>{s.style.position='static'});

  const box=lineEl.getBoundingClientRect();
  const nat=spans.map(s=>{const r=s.getBoundingClientRect();return {x:r.left-box.left,w:r.width}});
  const lineW=box.width;
  /* The words are about to leave flow, which would leave this box zero-high, and
     a zero-high box centred by translateY(-50%) hangs its words below the line
     they were set on. Give it the line's real height. */
  const lineH=spans[0].getBoundingClientRect().height;

  spans.forEach((s,i)=>{s.style.position='absolute'; s.style.left=nat[i].x+'px'});
  lineEl.style.width=lineW+'px';
  lineEl.style.height=lineH+'px';

  M={spans,nat,lineW,stageW:window.innerWidth,stageH:window.innerHeight};
}

/* ===========================================================================
   One frame of the narrative position p.
   =========================================================================== */
function render(p){
  if(!M) return;
  const {spans,nat}=M;

  /* ---- the line comes to ink. One channel on the container: a stagger here
     would be a second entrance competing with the exit that follows. */
  const ink=easeOut(t(p,PH.arrives));

  /* ---- THE CONSUMPTION, AND THE LINE CLOSES TO THE MARGIN AS IT HAPPENS.

     The words do not move relative to the line. What moves is the LINE: it keeps
     its first surviving word on the column's margin, so every word that goes
     pulls what remains to the left. The movement is CAUSED by the consumption
     rather than laid on top of it or postponed until after it, and it needs no
     separate travel phase — by the time only `chapter` is left it is already
     standing exactly where `Studio` will stand.

     The left edge is advanced by interpolation rather than by a switch, so it is
     continuous under any scroll and reverses exactly. */
  const c=t(p,PH.consumes);
  /* Each word's own raw progress. The ink and the closing are drawn from it by
     two DIFFERENT curves, and that separation is load-bearing.

     Driven from one curve they are in lockstep: the word is at half ink exactly
     when the line has closed half its offset, so the dying word is carried past
     the column's margin while it is still legible. Measured at 388 before this
     was split — `Some` sat at x = -3 with 44% of its ink left, sliced by the
     frame edge. A word being clipped reads as a fault, never as a decision.

     So the ink is spent inside the first .58 of the word's progress and the
     closing does not begin until .50 — by the time the line has moved anything
     worth seeing, there is nothing left to see. The word goes, THEN the line
     closes up behind it: cause and effect, in that order, which is also how it
     reads. */
  const u=[
    clamp((c-0.000)/0.44),
    clamp((c-0.280)/0.44),
    clamp((c-0.560)/0.44),
    t(p,PH.anotherOut),
  ];
  const fade=(x)=>easeInOut(clamp(x/0.58));
  const shut=(x)=>easeInOut(clamp((x-0.50)/0.50));

  for(let i=0;i<4;i+=1) spans[i].style.opacity=String(ink*(1-fade(u[i])));

  let live=nat[0].x;
  for(let i=0;i<4;i+=1) live=lerp(live, nat[i+1].x, shut(u[i]));
  lineEl.style.transform=`translate(${(-live).toFixed(2)}px, -50%)`;

  /* ---- the hand-over. The line's `chapter` and the name's `chapter` are the
     same word, same size, same weight, on the same left edge — so this crossfade
     is invisible and simply moves ownership. The period goes with it: the
     sentence stops being a sentence at the instant its last word stops belonging
     to it. */
  const hand=easeInOut(t(p,PH.stopOut));
  spans[KEEPER].style.opacity=String(ink*(1-hand));
  spans[PERIOD].style.opacity=String(ink*(1-hand));

  /* ---- THE EXCHANGE. Two independent curves with a held frame between them.
     Nothing overlaps: `chapter` is at zero long before `Studio` is above it, so
     the eye is never asked to read the word that is neither of them. */
  const D=dip();
  const goes=easeInOut(t(p,[D.start,D.outEnd]));
  const comes=easeInOut(t(p,[D.inStart,D.inEnd]));
  fromEl.style.opacity=String(hand*(1-goes));
  toEl.style.opacity=String(comes);

  /* ---- THE PAGE. Nothing is removed to make room for anything: the folio files
     the page, the deck captions it, and the index takes the deck's own line when
     the deck has finished being read. `Studio` never moves and never fades. */
  folioEl.style.opacity=String(easeInOut(t(p,PH.folioIn)));
  deckEl.style.opacity=String(easeInOut(t(p,PH.deckIn))*(1-easeInOut(t(p,PH.deckOut))));
  indexEl.style.opacity=String(easeInOut(t(p,PH.indexIn)));

  /* ---- THE CAMERA. One push, toward the couple, from the first frame to the
     finished page. It carries the whole piece underneath the type rather than
     waiting for the type to finish — measured on the previous version, the first
     thing on screen to move at all did so 2148px in.

     `easeInOut` is a cubic whose derivative is zero at both ends, so it begins
     without a lurch and comes to a true standstill: the page is composed on a
     frame that has stopped, and stays stopped. */
  const cam=easeInOut(clamp(p/0.964));
  plateEl.style.transform=`scale(${(1+0.09*cam).toFixed(4)})`;

  const lum=exposureAt(p);
  plateEl.style.filter=
    `brightness(${lum.toFixed(3)}) saturate(${lerp(0.80,1,clamp((lum-0.38)/0.45)).toFixed(3)})`;

  /* The column deepens as the photograph brightens, so the type keeps the same
     separation from a ground that is gaining two and a half stops under it. One
     dependency, and it is the one a darkroom would use: you burn in more as the
     print comes up. */
  columnEl.style.opacity=String((0.62+0.38*clamp((lum-0.42)/0.50)).toFixed(4));

  hud(p);
}

/* --------------------------------------------------------------------- hud */
const hudEl=document.getElementById('hud');
const hudPhase=document.getElementById('hudPhase');
const hudP=document.getElementById('hudP');
const scrub=document.getElementById('scrub');
function phaseName(p){
  const D=dip();
  if(p<0.060) return '1 · the studio speaks';
  if(p<0.140) return '2 · the line holds';
  if(p<0.430) return '3 · consumed — the line closes to the margin';
  if(p<0.520) return '4 · another chapter. — find them';
  if(p<0.575) return '5 · the hand-over — the period goes';
  if(p<D.outEnd) return '6 · chapter alone, then out';
  if(p<D.inStart) return '7 · THE SILENCE — you look';
  if(p<D.inEnd) return '8 · Studio';
  if(p<0.780) return '9 · the studio has signed';
  if(p<0.880) return '10 · what we actually make';
  if(p<0.964) return '11 · the way in';
  return '12 · THE PAGE — the work is next';
}
function hud(p){
  hudPhase.textContent=phaseName(p);
  hudP.textContent=p.toFixed(3);
  if(document.activeElement!==scrub) scrub.value=String(Math.round(p*1000));
}

let runway=0;
function boot(){
  runway=document.documentElement.scrollHeight-window.innerHeight;
  measure();
  render(clamp(window.scrollY/runway));
}
window.addEventListener('scroll',()=>render(clamp(window.scrollY/runway)),{passive:true});
window.addEventListener('resize',boot);
window.addEventListener('load',boot);
boot();

scrub.addEventListener('input',()=>{ window.scrollTo(0,(+scrub.value/1000)*runway); });
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){ hudEl.hidden=!hudEl.hidden; return; }
  const step=runway*0.004;
  if(e.key==='ArrowRight') window.scrollTo(0,window.scrollY+step);
  if(e.key==='ArrowLeft')  window.scrollTo(0,window.scrollY-step);
});
</script>
